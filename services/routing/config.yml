# The router's configuration, read by ScenicRouterMain (the import and the probes: its graphhopper: node only) and
# by ScenicServerApplication, the served GraphHopper (T-0392: both nodes) - one file, so a profile the test
# exercises is the profile that ships.
#
# scenic_score is in graph.encoded_values, which is the whole reason the import needs our ImportRegistry:
# GraphHopper's own registry does not know the name and the import fails without it.
graphhopper:
  graph.location: /graph
  datareader.file: ""

  # osm_way_id is GraphHopper's own encoded value (DefaultImportRegistry knows it; our ImportRegistry only
  # adds scenic_score). It is here so that a value read back out of the built graph can be bound to a NAMED
  # OSM way - `--mode probe --probe-ways 74344132` walks the edges and answers way id -> scenic_score with no
  # coordinate and no snap in the loop. It costs 31 bits per edge in the graph and nothing at query time, and
  # it ships rather than living in a probe-only config: the config under test has to be the config that ships.
  #
  # T-0381: the safety gates GraphHopper 11 can read are its own track_type and smoothness; the three it cannot
  # (a locked gate on the way, ford=yes exactly, a driveway/parking_aisle/drive-through/emergency_access service
  # way) are booleans our ImportRegistry adds (GateFacts). road_environment == FORD is NOT used: it fires on any
  # ford value, ford=no included. Adding a name here changes the edge layout - the graph must be re-imported.
  graph.encoded_values: car_access, car_average_speed, road_class, road_access, surface, scenic_score, osm_way_id, track_type, smoothness, gate_locked_barrier, gate_ford, gate_service_way

  # GraphHopper 11 refuses to start without this key. It drops ways a car can never use from the graph; it is
  # NOT a scenic gate and it names no motorway or trunk - those carry scenic_score 0 and are penalized by the
  # per-request model, never hard-excluded.
  import.osm.ignored_highways: footway, cycleway, path, pedestrian, steps

  # Contraction hierarchies stay OFF: every request carries its own custom model (the lambda penalty), and a
  # per-request custom model is only legal on a flexible query. Neither profiles_ch nor profiles_lm is listed.
  custom_models.directory: /app/profiles

  profiles:
    # car_fast: the fastest route under the SAFETY gates alone. Problem A's T_fast, and the value lambda=0
    # must reproduce.
    - name: car_fast
      weighting: custom
      custom_model_files: [car_scenic_base.json]
    # car_scenic: same graph, same gates; the scenic penalty arrives per request as a custom model so that one
    # graph serves every lambda the bisection asks for.
    - name: car_scenic
      weighting: custom
      custom_model_files: [car_scenic_base.json]

# T-0392: the HTTP surface, read by ScenicServerApplication only. The application port is reachable only on the
# compose network (compose publishes no GraphHopper port; Caddy is the front door); the admin port stays on the
# container's loopback. The request log is OFF: /route bodies and /isochrone queries carry coordinates.
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  request_log:
    appenders: []
