# Designated scenic byways - the score's second external oracle, after Curvature. Both are ArcGIS /query
# pulls rather than published files, so their stability was MEASURED rather than assumed: two consecutive
# full pulls of each returned byte-identical bodies, same sha256 and same length. They are pinned by sha256
# for the same reason vermont-curvature.kmz is - an oracle that silently follows upstream is not an oracle.
# If Caltrans designates a route or FHWA edits layer 107, this fetch must FAIL and a human must re-pin it
# having looked at what moved, rather than the overlay changing under a run nobody was watching.

- name: byways-caltrans.geojson
  url: https://services1.arcgis.com/0MSEUqKaxRlEPj5g/arcgis/rest/services/CA_Scenic_Hwys/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson
