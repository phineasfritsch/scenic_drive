# ESA WorldCover 2021 v200, 10 m land cover. Replaces the USFS Tree Canopy Cover and NLCD impervious layers
# the plan originally named: MRLC's S3 now refuses all anonymous access (403, Requester Pays), their landing
# pages carry no download link, and retrieval needs the interactive viewer or an authenticated order. There
# is no guessable public URL - checked, not assumed.
#
# WorldCover is 10 m against NLCD's 30 m, and its classes give both terms directly: Tree cover (10) and
# Shrubland (20) feed `canopy`, Built-up (50) feeds `impervious`. The score needs FRACTIONS in a 150 m
# buffer rather than an absolute canopy percent, so class fractions are the right shape anyway. What is lost
# is TCC's continuous 0-100 canopy percent and NLCD's calibrated impervious fraction; if T-0029's rank-order
# fixtures show the redwood-versus-strip-mall discrimination is weak, revisit with a one-time manual MRLC
# clip hosted in our own R2 and pinned by sha256.
#
# Tiles are 3x3 degrees named by their SOUTH-WEST corner, so N36W123 covers lat 36-39, lon -123..-120.

