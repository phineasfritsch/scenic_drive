  bytes: 8764515
  retrieved: 2026-09-07
  consumed_by: T-0028
  notes: 273 features, Status {E 207, OD 66}, and that field has NO coded-value domain in the service (domain null, checked live) - etl/byways.py records what the two values mean and which Caltrans document each claim comes from. Licence posture is the portal item's own licenseInfo (Caltrans as-is disclaimer) with accessInformation "California Department of Transportation" and access public; the service's copyrightText is empty. MILES is 0 or null on 247 of the 273 rows, so every length derived from this file is computed from geometry, never read from that field.

