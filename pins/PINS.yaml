- id: P-PROC-05
  statement: "The mutation population for the ETL geometry terms is populated on every one of the six classes PR #94's review rounds found - ops/mutate/geometry.py refuses a population that has lost a whole class even when its COUNT is still at the floor"
  why_no_test_catches_it: "A mutation population is a list of tuples in a file, and the only thing that ever reads it is the harness nobody runs on a schedule. The pass condition of a mutation run - every mutation was killed by the test that names it - is satisfied by an EMPTY list: 0 of 0, exit 0, the cleanest sheet the runner can print, which is why budget.py grew MIN_MUTATIONS. A COUNT is not enough here and that is the whole reason this pin exists. PR #94 (T-0161) went FOUR review rounds on one shape - the fixture's geometry population is degenerate on axis X, so a mutant restricted to a subset of the segment-pair matrix survives with nothing red - refiled each round with a new X: the way's first segment only, then a polyline replaced by its chord, then the pair of segments interior to BOTH polylines, and a fifth axis (a banded window, abs(i - j) <= 1, the shape a monotone sweep's pruning has) recorded in agent/rv4-pr94's PASS entry rather than bought as a round. Every one of those rounds had a population that was complete by its own count and empty on the next axis. So REQUIRED_CLASSES in ops/mutate/geometry_mutations.py is a literal list of six class names, every one of which must be populated, and MIN_MUTATIONS = 12 and MIN_EQUIVALENT = 4 are the exact lengths of the two lists rather than slack bounds. The assertion is --prove-floor, which costs no pytest run: it empties the population, then deletes one entry, then TRADES the last class for copies of a surviving one so the count still reads 12 - the arm no count can pass - and finally requires the real population to be accepted. Seen red three ways before it was seen green, on 2026-09-19 with the banded-subset entry deleted: the plain sweep exits 2 with 'POPULATION FLOOR: no mutation left in class banded-subset - that whole axis is unmeasured', this assertion exits 1 with 'FLOOR PROOF FAILED ... real -> accepted=False', and with the entry restored but its two killers not yet written the sweep exits 1 with the mutant listed under CAUGHT, BUT NOT BY THE TEST THAT NAMES IT. A FOURTH refusal arm was bought by agent/rv1-pr107 on PR #107, and it is the same defect one axis further in: an entry whose killers list is EMPTY read as a catch, because red_by_name([], failed) is [] and the sweep asks len(red) != len(killers), which is 0 == 0. Emptying the banded-subset entry's two killer names left the plain sweep at exit 0 with the clean two-line verdict and this assertion at exit 0 as well, while that mutant applied, moved its fingerprint and turned three tests red - the sixth class measured by nothing, on a sheet that read clean. population_ok now refuses such an entry BY NAME before any pytest runs, and --prove-floor's fourth arm empties one entry's killers with the count still at 12 and all six classes still populated, which is the arm neither the count arm nor the class arm can see. Seen red before green on 2026-09-19 in exactly that state: the plain sweep exits 2 with 'POPULATION FLOOR: keep only the segment pairs with abs(i - j) <= 1 - rv4-pr94's sixth class names no killer - a mutation nobody is required to catch is not a measurement', and this assertion exits 1 with 'FLOOR PROOF FAILED ... real -> accepted=False'."
  anchor: process
  runs_on: [linux]
  assertion: "\"${PYTHON:-$(command -v python3 || command -v python)}\" ops/mutate/geometry.py --prove-floor"
  owner: agent/claude-opus-5
  added: "2026-09-19"

- id: P-PROD-05
  statement: The corpus, Worker and device-reader schema_version are one value - services/etl/etl/schema.py SCHEMA_VERSION == services/api/src/index.ts SCHEMA_VERSION == Sources/PlaceStore/PlaceStore.swift PlaceStore.schemaVersion (T-0175), with the Worker's value pinned on the wire by services/api/test/routes.test.ts
  why_no_test_catches_it: "Two literals in two languages with no compiler between them, and the number decides whether a device may download a corpus at all (plan, Runtime lifecycles / OTA: download only if schema_version == PlaceStore.schemaVersion && min_app_build <= build). On 2026-09-18 they were 1 and 0 - PR #100 shipped the corpus emitter at SCHEMA_VERSION 1 and the Worker had been 0 since it was written - and the whole suite was green over the disagreement, because each side tests only itself: test_corpus_schema.py pins the ETL's value against the DDL hash, routes.test.ts pins the Worker's on the wire, and nothing in the repository had ever read both. The shipping shape of the defect is silent and cross-version: a device asks the Worker what version the corpus is, gets a number the corpus does not have, and either refuses every OTA update forever or accepts one its reader cannot parse - and the second is data corruption on a phone, found by a user. A shared constant would not fix it: the Worker is bundled out of services/api/ and cannot read services/etl/, and importing the same constant the handler imports would delete the wire test's whole value. So the values stay typed at their own sites and ops/lib/check-schema-version.py reads both as TEXT and refuses on disagreement. It is fail-closed - a missing file, a missing or duplicated literal, or this pin id gone from PINS.yaml all exit 2 rather than printing ok - because the only thing that runs the check is this pin. Seen red before green, by name: on origin/main's two values (1 vs 0, exit 1), on this branch after the corpus bump and before the Worker's (2 vs 0, exit 1), and in --prove-red's seven-case table, where the control plus six mutations (corpus bumped alone, Worker bumped alone, the pin id deleted, each literal deleted, the corpus literal duplicated) each have to produce the exit code the table states. T-0175 widened it to the device reader's typed literal, `public static let schemaVersion: Int = <n>` in Sources/PlaceStore/PlaceStore.swift, read as text like the other two: --prove-red is ten cases, adding PlaceStore bumped alone (exit 1), corpus and Worker bumped with PlaceStore not (exit 1) and the PlaceStore literal deleted (exit 2). PlaceStoreReadTests.testSchemaVersionLiteralEqualsBuiltCorpus is the runtime half: it builds a corpus with the shipping `python -m etl.corpus` and compares its meta.schema_version to the same literal. T-0300 put the literal to WORK on the device: CorpusUpdater.decide(manifestJSON:appBuild:activeVersion:), the entry point the app runs on every OTA manifest, downloads only when the manifest's schema_version equals PlaceStore.schemaVersion and min_app_build <= the app build, so this pin also runs, by name through ops/lib/run-named-tests.py, the decision table that holds that gate: PlaceStoreTests.CorpusUpdateDecisionTests/decisionTableVariantA() and /decisionTableVariantB() (45 rows each, every row a function of the manifest variant and compared by full equality of the decision or typed error - reader +-1 refused, min_app_build == build accepted and build+1 refused, the active version up to date, every missing/extra/mistyped field a typed refusal) and /noRowIgnoresItsVariant() (no row ignores its variant). PlaceStore and its schemaVersion are now declared on every toolchain (the GRDB members stay gated), so the table runs on the Windows dev box as well as linux-core. Seen red by name before green (T-0300 Log)."
