# Load-bearing properties. ops/check-pins runs every assertion; see ops/lib/pins.py for the rules.
#
# Fields: id, statement, why_no_test_catches_it, anchor (source|config|artifact|api|db|process|human),
#         runs_on [linux|mac|device|human], assertion (bash, run from repo root, exit 0 = holds),
#         owner, added, last_verified, verifier (must differ from owner), expires_days, pending (task id).
# Never anchor a pin on a comment. Red pins are allowed; TODO assertions are not.

- id: P-SRC-01
  statement: Root-package targets import Foundation only - never CoreLocation, MapKit, UIKit, SwiftUI, MapLibre, Ferrostar
  why_no_test_catches_it: The code compiles and tests pass on the Mac; only Linux CI notices, ten minutes after an agent reported success
  anchor: source
  runs_on: [linux, mac]
  assertion: "! grep -rEn '^\\s*(@testable\\s+)?import\\s+(CoreLocation|MapKit|UIKit|SwiftUI|MapLibre|Ferrostar)' Sources/"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-SRC-02
  statement: No Swift source file exceeds 300 lines
  why_no_test_catches_it: A 900-line file is a merge grenade for parallel agents; nothing functional breaks. The old `find`-based assertion also passed vacuously over a deleted, renamed or emptied Sources/Tests tree (reviewer-10, same class as P-OPS-01).
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-line-cap"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-01
  statement: Every script in ops/ and .githooks/ is committed with the executable bit (git mode 100755); data files are not
  why_no_test_catches_it: core.filemode is false on the Windows checkout this repo is driven from, so a new script is committed 100644 and nothing complains. CI invokes them as `bash ops/x` and stays green, but queue/README.md and Xcode Cloud both invoke them directly, where a missing +x is a hard failure. The exec bit is invisible to every other check. The assertion also refuses to pass on an empty or truncated file set, which the original one-liner did (reviewer-5).
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-exec-bits"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-03
  statement: ops/merge's --no-task-reason override line is always valid UTF-8, and always exactly one line under Unicode line-break rules - the str.splitlines() definition, so U+0085, U+2028 and U+2029 count as breaks and not only LF; its 200 cap counts characters, not bytes
  why_no_test_catches_it: ops/ has no test tier - ops/test runs swift, vitest and pytest and nothing else - so ops/merge's behaviour is only ever exercised by hand, at merge time, against a live PR. A truncation that splits a UTF-8 sequence is invisible there because the terminal renders the orphaned bytes as one replacement glyph and nothing exits non-zero; the audit trail is the only artefact that records why a review gate was overridden, and it was silently storing invalid bytes (T-0049, found by reviewer-26 while reviewing T-0044). The cap also cannot be checked in the language of the bug: bash's ${#s} counts bytes with no locale set and UTF-16 code units under LC_ALL=C.UTF-8 on the Cygwin bash this repo is driven from. The one-line half is stated in splitlines() terms because that is the definition the assertion uses and the one a Unicode-aware reader of the audit trail uses; T-0044's sanitizer is byte-oriented tr, which cannot see three of the five code points that definition honours, and agent/reviewer-39 forged a MERGED/DRY RUN gate line through the gap end to end. The assertion refuses to pass unless a case actually straddles the cap, a case attempts a gate-line forgery, a case carries each family of line break, a case carries ESC, a case sanitizes away to nothing, and a case carries a precomposed character - so it cannot go quietly decorative, and its statement cannot again be broader than its inputs.
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-merge-reason-cap"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-GIT-01
  statement: .gitattributes normalizes every text file to LF
  why_no_test_catches_it: Lost on 2026-09-07 to a sweep-everything demo commit; every ops/* script would then break under WSL2 with no test failing
  anchor: config
  runs_on: [linux, mac]
  assertion: "grep -qE '^\\* text=auto eol=lf' .gitattributes"
  owner: agent/claude-opus-5
  added: 2026-09-07

