# Load-bearing properties. ops/check-pins runs every assertion; see ops/lib/pins.py for the rules.
#
# Fields: id, statement, why_no_test_catches_it, anchor (source|config|artifact|api|db|process|human),
#         runs_on [linux|mac|device|human], assertion (bash, run from repo root, exit 0 = holds),
#         owner, added, last_verified, verifier (must differ from owner), expires_days, pending (task id).
# Never anchor a pin on a comment. Red pins are allowed; TODO assertions are not.

- id: P-SRC-01
  statement: Root-package targets import Foundation only - never CoreLocation, MapKit, UIKit, SwiftUI, MapLibre, Ferrostar
  why_no_test_catches_it: The code compiles and tests pass on the Mac; only Linux CI notices, ten minutes after an agent reported success
  anchor: source
  runs_on: [linux, mac]
  assertion: "! grep -rEn '^\\s*(@testable\\s+)?import\\s+(CoreLocation|MapKit|UIKit|SwiftUI|MapLibre|Ferrostar)' Sources/"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-SRC-02
  statement: No Swift source file exceeds 300 lines
  why_no_test_catches_it: A 900-line file is a merge grenade for parallel agents; nothing functional breaks. The old `find`-based assertion also passed vacuously over a deleted, renamed or emptied Sources/Tests tree (reviewer-10, same class as P-OPS-01).
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-line-cap"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-01
  statement: Every script in ops/ and .githooks/ is committed with the executable bit (git mode 100755); data files are not
  why_no_test_catches_it: core.filemode is false on the Windows checkout this repo is driven from, so a new script is committed 100644 and nothing complains. CI invokes them as `bash ops/x` and stays green, but queue/README.md and Xcode Cloud both invoke them directly, where a missing +x is a hard failure. The exec bit is invisible to every other check. The assertion also refuses to pass on an empty or truncated file set, which the original one-liner did (reviewer-5).
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-exec-bits"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-02
  statement: Every hook in .githooks/ prints the blob id and directory of the file that actually ran, and refuses to run from anywhere but the current worktree's .githooks
  why_no_test_catches_it: core.hooksPath is untracked, machine-local, and shared by every worktree of this repo, so no diff, no test and no review has ever seen it. On 2026-09-08 it held an absolute path into the main checkout for part of the day: every worktree ran main's hooks, a branch could not exercise its own .githooks change by committing, and PR #47 recorded a REFUSED commit that had in fact been accepted. It fails open - the commit succeeds and prints nothing - and the value changed mid-session with nothing recording it. Same class as P-OPS-01: the hook exists, reads correctly, and is not the thing that ran. The assertion runs the guard rather than grepping it, so a gutted guard fails, and it checks that the id the guard prints matches git hash-object, so a recorded HOOK line stays checkable after the fact.
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-hook-guard"
  owner: agent/hookspath
  added: 2026-09-08

- id: P-GIT-01
  statement: .gitattributes normalizes every text file to LF
  why_no_test_catches_it: Lost on 2026-09-07 to a sweep-everything demo commit; every ops/* script would then break under WSL2 with no test failing
  anchor: config
  runs_on: [linux, mac]
  assertion: "grep -qE '^\\* text=auto eol=lf' .gitattributes"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-DATA-02
  statement: Root package declares iOS 18.4 as the platform floor (unified maps.apple.com waypoint URLs need it)
  why_no_test_catches_it: Bumping the target for a nicer API is a routine agent change with a silent revenue consequence
  anchor: config
  runs_on: [linux, mac]
  assertion: "grep -q 'iOS(\"18.4\")' Package.swift"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-TEST-01
  statement: A floor file exists per tier, each is an integer, and every tier whose manifest is in the tree has a floor of at least 1 - asserted per tier, never as a sum
  why_no_test_catches_it: ops/test enforces the floors, but an agent can delete a floor file (it then reads as absent) or drive one tier to 0 while the others carry the total; the first version of this pin summed the three and so reproduced the aggregation defect the tiers exist to remove - with the swift floor at 0, 10 of 16 Swift tests were deleted and check-pins stayed green
  anchor: config
  runs_on: [linux, mac]
  assertion: "for f in pins/floor_linux_swift.txt pins/floor_linux_ts.txt pins/floor_linux_py.txt pins/floor_ios.txt; do grep -qE '^[0-9]+$' \"$f\" || exit 1; done; test \"$(cat pins/floor_linux_swift.txt)\" -ge 1 || exit 1; if [ -f services/api/package.json ]; then test \"$(cat pins/floor_linux_ts.txt)\" -ge 1 || exit 1; fi; if [ -f services/etl/pyproject.toml ]; then test \"$(cat pins/floor_linux_py.txt)\" -ge 1 || exit 1; fi; exit 0"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-PROC-01
  statement: No task reaches done/ without a reviewer who is not its owner
