- id: P-PROC-06
  statement: A module added under services/etl/etl/ or Sources/ ships a mutation population under ops/mutate/ - every population declares its subjects in SUBJECT_MODULES, and a module that has a population never loses it silently
  why_no_test_catches_it: "CLAUDE.md's Verification section has said since the plan that a new numeric module under services/etl/etl/ or Sources/ ships its mutation population under ops/mutate/ with a literal floor, and nothing in this repository ever read that sentence. The evidence is the shipped tree: sinuosity.py went through FOUR review rounds on PR #94 before a population existed for it, assemble.py merged on #102 with none, and T-0170 shipped Sources/Handoff/StraightLineDistance.swift - great-circle hops that become the distance on a handoff screen - with none, which is now T-0199. A test cannot catch it because the thing missing is a FILE THAT WAS NEVER WRITTEN: every suite is green, every mutation driver that does exist reports a clean sheet over its own subjects, and the module with no driver is invisible to all of them. Worse, the subjects were undeclared: ten drivers stated them ten ways - SUBJECTS as a tuple, SUBJECTS as a list, bare SRC/ERR/SIGN/MAP/STRIP/FLAG/SCORE/TERMS - and ops/mutate/geometry.py stated its three only in its DOCSTRING, so the only machine-readable answer to 'which modules have a population' was a comment, which CLAUDE.md forbids a guard from anchoring on. So SUBJECT_MODULES is now a literal tuple of repo-relative paths in each of the ten drivers, DRIVERS in ops/lib/check-mutate-population.py is a WHITELIST (a new ops/mutate/*.py with a __main__ block that is in neither DRIVERS nor PROBES is a refusal, not a silent pass), and COVERED_FLOOR is the literal list of the 22 modules covered today so a population cannot be narrowed away. The allowlist is DATA - ops/lib/mutate-population-allowlist.json, one reason per entry, read by a human on every widening - because the gate cannot decide whether a module is numeric; what it refuses mechanically is an empty reason, an entry for a module a population also covers, and an entry naming a file that is not there. Seen RED BY NAME before green, on 2026-09-19: on a copy of the tree in main's pre-T-0176 state (ops/mutate/geometry.py's SUBJECT_MODULES without sinuosity.py and the floor without it, built by .build-t0186/build_redtree.py) with assemble.py and sinuosity.py as the added set, it exits 1 with both named under 'module(s) added by this branch with no mutation population'; on this tree it exits 0 with '71 modules, 22 covered by 10 populations, 25 allowlisted, 0 added by this branch'. --prove-red runs eight cases against a sandbox copy: the control, a population file deleted (exit 2), a driver narrowing SUBJECT_MODULES (exit 1, the floor arm no count can see), a new module added with no population (exit 1), a new module that IS allowlisted (exit 0, the false-positive control), the allowlist widened to a module a population covers (exit 2), an allowlist entry with an empty reason (exit 2), and this pin id deleted from PINS.yaml (exit 2, because the only thing that runs this check is this pin)."
