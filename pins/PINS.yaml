- id: P-ATTR-01
  statement: The basemap credit on the home screen is the plan's string for the Protomaps tiles and MapLibre's own for the demo tiles, both declared verbatim, it comes from the SAME RESOLVED style the map is mounted with rather than from a literal at the call site, the LA basemap is mounted on a surface at all, every map surface in the app is one of the mount sites typed into the check, and the footer is never hidden from accessibility
  why_no_test_catches_it: "Nothing in this repository can run a SwiftUI view - ScenicApp/Package.swift declares no test targets - so every proof that a footer is ON SCREEN is an XCUITest in a simulator, and there is no Apple toolchain on the authoring box. Meanwhile the ways this invariant goes false are all invisible to a compiler: the two credit arms of `MapStyle.attributionText` trade places and the demo map - country polygons, no OpenStreetMap data, which is every ios-compile run and every phone before the owner copies the archive in - carries `© OpenStreetMap contributors · Protomaps`, with every identifier still present and every grep count unchanged (T-0195's mutant pass found exactly that); a feature target names `MapStyle.protomapsLALight` directly and builds the Protomaps style without asking BasemapResolver whether the archive is on the device; the credit is typed as a literal at the footer's call site, which is right on a device with la.pmtiles and a lie on every device without it; or `BasemapResolver.losAngeles(` has no call site at all and the whole adapter is correct, complete and mounted on nothing (it had none until T-0178). So the assertion is structural, over the Swift source, and decides six things: (a) the ARM - inside `public var attributionText: String`, the first line carrying code after `case .protomapsLALight, .protomapsLADark:` is exactly `return MapStyle.protomapsAttribution`, and after `case .maplibreDemoTiles:` exactly `return MapStyle.demoAttribution`; (b) the TWO DECLARATIONS, as a WHITELIST OF WHOLE LINES - every line under apps/ios naming `static let protomapsAttribution` or `static let demoAttribution` is exactly one of the two approved declarations, compared TRIMMED and WHOLE (`public static let protomapsAttribution = \"© OpenStreetMap contributors · Protomaps\"` and `public static let demoAttribution = \"© MapLibre · Natural Earth\"`), and the plan's string occurs in code exactly once over apps/ios, at its declaration, so a credit typed anywhere else is refused by name. The comparison is whole-line because the pre-review mutant pass of 2026-09-19 got two false credits past a prefix and a substring match with every check green and every count unchanged: the demo credit set to `© OpenStreetMap contributors, Protomaps` (A2 - a near-spelling under tiles that carry no OpenStreetMap data, i.e. every device without la.pmtiles and the Skyline drive always), and the Protomaps declaration keeping the plan's literal and appending ` + \" · Natural Earth\"` (A3). The demo credit may never name OpenStreetMap contributors. Limb (b) carries a SECOND population for the same reason, because an identifier-keyed whitelist was blind to rv1-pr119's M3 - `public static let tileCredit = \"(c) OpenStreetMap contributors and Protomaps\"` declared under a NEW identifier in a second MapAdapter file, green on every limb: every `static let` LINE under apps/ios whose value names OpenStreetMap is that one approved declaration, compared trimmed and whole, so a paraphrase under any identifier is refused by name; (c) a WHITELIST over the identifier `protomapsLA`, counted with multiplicity over every *.swift under apps/ios with // stripped, against a tracked set typed into the check - MapStyle.swift(6), MapAppearance.swift(2), DriveCopy.swift(2) - plus a second anchor a count cannot give: every occurrence OUTSIDE Sources/MapAdapter/ must sit on a `case .` pattern line, so a feature target may MATCH the resolver's answer (DriveCopy's caption does) and may never NAME a case; (d) the MOUNT AND ONE RESOLVED VALUE FOR BOTH HALVES - `BasemapResolver.losAngeles(` exactly once, in FeatureScenicHome/DriveBasemap.swift; `DriveBasemap.resolve(` exactly once, in ScenicHomeScreen.swift; and the FOOTER's argument list, read from the construction itself, which must hand `text:` a LOCAL BINDING's `.attributionText` carrying no quote, with the map mounted from that same binding (`styleURL: <binding>.url` once, and `styleURL:` once). The same-binding limb exists because A5 of the mutant pass took the credit from a SECOND `DriveBasemap.resolve(for: .santaMonicaMountains, appearance: .light)` while the renderer kept the first: the argument still ended in `.attributionText`, so the old argument-list reader was green while the Skyline drive's demo tiles carried the Protomaps credit; (e) the FOOTER IS NOT HIDDEN FROM ACCESSIBILITY - acceptance bullet 2's own limb, unimplemented until the mutant pass found it (A7): every occurrence of the identifier `accessibilityHidden` in DesignSystem/AttributionFooter.swift and in the mount screen is `accessibilityHidden(false)`, and the footer carries at least one. A WHITELIST, so `(true)`, an interpolated argument and every other spelling are refused by name; `.accessibilityHidden(true)` renders identically in every screenshot and leaves a VoiceOver user with no credit line at all, which is a licence breach no snapshot can see; (f) EVERY MAP SURFACE, as a WHITELIST - what makes a surface a MAP surface is a `MapView(` construction handed a `styleURL:`, and every occurrence of either over apps/ios, counted with multiplicity and // stripped, is at a site typed into the check (ScenicHomeScreen.swift(1) each) outside the ONE definition site, MapAdapter/MapView.swift, which is itself pinned here by `struct MapView` and `public init(styleURL` occurring exactly once, there and nowhere else, so a second definition or a moved one cannot carry its own occurrences out of the counted population. This limb exists because review round 1 of PR #119 (B2) mounted `MapView(styleURL: style.url, ...)` in a SECOND file under FeatureScenicHome with no AttributionFooter and every other limb stayed green: (d) counted `styleURL:` inside the mount screen alone, so the clause this pin states as 'every map surface carries the credit' was being asserted over ONE screen while a real surface could ship the Protomaps tiles with no credit line at all. The recorded fourth grep from rv1-pr112 is not lifted: