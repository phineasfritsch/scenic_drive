- id: P-STORE-01
  statement: Terms of Use and Privacy Policy links in Settings AND on the paywall; the paywall is SubscriptionStoreView with Restore visible; Settings has Restore (AppStore.sync()) and Manage subscription; the in-app ODbL notice is LICENSE-DATA's - the SOURCE half, at exactly the approved sites
  why_no_test_catches_it: "Nothing in this repository runs a SwiftUI view (ScenicApp declares no test targets) and App Review 3.1.2 is the only party that notices a missing Terms link - after a submission. The ways it goes false compile cleanly: a link deleted or retyped as a literal, `.storeButton(.hidden, for: .restorePurchases)`, Restore moved off the store view, a paywall built without SubscriptionStoreView, a second store surface with no links, Restore calling something other than AppStore.sync(), a feature target importing Entitlements, or the -screen launch read escaping `#if DEBUG`. So the assertion is structural (T-0271, ops/lib/check-store-links.py with its data in store_links_pinned.py): a fail-closed whole-line WHITELIST keyed on identifiers over every *.swift under apps/ios - every line naming SubscriptionStoreView, restorePurchases, subscriptionStoreControlStyle, subscriptionGroupID, termsOfUseURL, privacyPolicyURL, AppStore.sync(), manageSubscriptionsSheet, PaywallScreen(, SettingsScreen(, LegalAttributionScreen(, LaunchScreen.atLaunch, onSettings, settingsButton, \"home.settings\" or `import Entitlements` is one of the approved (file, whole line) pairs, with multiplicity, // -leading lines dropped and nothing else; every import, accessibilityIdentifier, `#` directive and UserDefaults line under Sources/Entitlements likewise; the paywall's modifier chain WITH the safeAreaInset that mounts the links, Settings' `List { subscription / about }`, the shell's Settings sheet and the DEBUG fence as runs of consecutive non-blank lines; Sources/Entitlements FROZEN - exactly its five files, each equal to an approved sha256 of its non-blank kept lines, so a modifier that hides or disarms a pinned control (opacity, an openURL override, a hit-testing switch on a closing brace), a /* */ block or a view extension in the module is refused until a reviewed commit re-approves the digest; and the in-app ODbL notice equal to LICENSE-DATA's OpenStreetMap section line for line. --prove-red applies 29 named mutants alone to a copy, each refused BY NAME (among them: either link removed on either screen, restore hidden, restore dropped, restore moved onto the links, the paywall without SubscriptionStoreView, a second paywall file; and the pre-review pass's five survivors - the paywall's links unmounted, Settings' About unmounted, the Terms link in a /* */ block, an openURL override, the paywall at opacity 0), and 4 legitimate edits stay green (a // line, a re-indent, a blank line, a /// doc comment reworded). WHAT IT CANNOT SEE: whether anything renders or is reachable by a tap, whether StoreKit loads products (no subscription group exists in App Store Connect yet; the group id is a PLANNED placeholder), whether the URLs resolve, a modifier or extension OUTSIDE Sources/Entitlements (DesignSystem, say) that changes what the frozen source draws. That is the XCUITest half and it belongs to T-0180 (the xcodeproj lock): it anchors on the identifiers this check pins (paywall.terms, paywall.privacy, paywall.store, settings.restore, settings.manage, settings.terms, settings.privacy, settings.legal, home.settings). It is named here rather than set as a pending: key, because a pending pin's assertion is skipped entirely by ops/lib/pins.py."
