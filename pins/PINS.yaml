- id: P-OPS-03
  statement: No gate pipes a producer into an early-exiting grep that the scan recognises - the recognised spellings are listed below, the unrecognised ones in the scan's own header
  why_no_test_catches_it: "Under pipefail, `grep -q` returning early gives the producer SIGPIPE and the pipeline exit 141, so the verdict depends on a race between how much the producer writes after the match and how fast grep returns. Eight sites had it: two in the pre-commit hook (the secret scan failed OPEN above 256 KB, P-SEC-01), one on the merge gate (a SIGPIPE from gh api reads as 'task not in queue/done/'), one in deploy, and P-SAFE-05, which lost the race 1 run in 3 on one reviewer's box and 0 in 10 on another - which is what makes it a flake rather than a failure, and why it was reported by two independent reviewers in one night. A text scan over ops/, .githooks/ and PINS.yaml matching grep/egrep/fgrep (bare, backslash-escaped, by path, or behind a VAR=value prefix, command, exec, env, nice, nohup, stdbuf, sudo, time or timeout) after | or |&, on the same line or the next when a line ends in a pipe, a pipe and a backslash, or a pipe and a comment (comment-only lines inside the continuation are skipped, as bash skips them, and never start one), followed anywhere by -q, -l or -L in a short group (quoted or not), --quiet, --silent, --files-with-matches, --files-without-match, -m<N> or --max-count; or with GREP_OPTIONS set in the consumer's environment. It refuses unless the six files that carried the class are in the scanned set, every pathspec enumerated something, at least 42 files are tracked (a floor: a count equality on a pull-request merge ref is a fact about the base branch, which is how this PR's own check went red in CI), and the per-file scan really ran (awk's exit status is read - the first version counted zero hits over an awk that failed on every file and printed OK)."
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-pipe-consumers"
  owner: agent/claude-opus-5
  added: "2026-09-16"

