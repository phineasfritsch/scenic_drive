- id: P-PROC-03
  statement: ops/queue-sweep never returns a task to ready/ while it names a branch, and refuses outright where git cannot answer
  why_no_test_catches_it: "The sweeper is the one command in this repository that DESTROYS state - it sets owner: null, the exact state T-0068 exists to reject, and leaves main saying ready/<id> while the branch says review/, which is the add/add divergence eleven branches were repaired for by hand. On 2026-09-15 every one of the 67 claimed tasks had an expired lease and 39 of them had an open PR, so one unguarded run would have discarded 39 finished branches. The guard that stops it was written for T-0131's first item and asserted by NOTHING: deleting it left ops/queue-check, ops/check-pins --source-only and the whole linux-core job green, because no check runs the sweeper at all. It cannot be covered by running it on the real queue either - the command mutates - so the assertion builds throwaway repos and reads what the sweeper SAID, not only where the file ended up: four of the seven cases are must-KEEP and each asserts the sentence naming its own branch, so a sweeper that exits 0 without looping fails all four; one that crashes before its loop fails every case on exit code."
  anchor: source
  runs_on: [linux, mac]
  assertion: "\"${PYTHON:-$(command -v python3 || command -v python)}\" ops/lib/check-sweep.py"
  owner: agent/claude-opus-5
  added: 2026-09-16

- id: P-PROC-04
  statement: The seven sweeper cases are discriminating - each variant of queue.py breaks exactly the cases named against it
  why_no_test_catches_it: "P-PROC-03 runs the cases; nothing ran the layer that proves the cases can fail. check-sweep.py states in its own docstring that --variants is 'what makes six cases discriminating rather than decorative', and that claim rested on a command no gate executed: grep found runners only in PINS.yaml (bare form) and in one task's acceptance block, and linux-core.yml runs check-pins, check-pins --source-only and queue-check and nothing else. So a stale marker, or a variant that silently stopped discriminating, would never be seen again - and combined with an unfloored case list that is the precise way this check goes hollow with every gate green. Raised as BLOCKING by agent/rv-pr85 while failing PR #85, whose own author had deferred the same question on the sibling check as 'the reviewer's call'."
  anchor: source
  runs_on: [linux, mac]
  assertion: "\"${PYTHON:-$(command -v python3 || command -v python)}\" ops/lib/check-sweep.py --variants"
  owner: agent/claude-opus-5
  added: 2026-09-16

- id: P-PROC-02
