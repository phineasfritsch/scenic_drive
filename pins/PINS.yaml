- id: P-NAV-01
  statement: "Off-route (more than 50 m from the planned line for at least 5 s) online asks for exactly the pinned waypoints not yet passed and the same lambda, once; offline it is rejoin mode with zero requests; the offline-to-online edge in rejoin mode asks once"
  why_no_test_catches_it: "The plan's Navigation section says a reroute re-requests the SAME drive - the remaining pins and the same lambda, never a bare origin-to-destination - and that offline the driver is guided back to the planned line with no request. Every one of those is a one-token edit in DriveSession.swift or DriveLine.swift that compiles and leaves ops/test's total above its floor: `>` for `>=` on the pin index sends the driver back to a pin they just passed, a global nearest-segment search counts a loop's closing leg as progress and drops every pin (a bare O->D), dropping the online check makes offline drives spend requests, and a reroute that keeps asking while one is out multiplies them. ops/test counts tests, so deleting or renaming the suites that hold these is also green. The assertion runs the tests by NAME through ops/lib/run-named-tests.py (named-tests.json lists every test of DriveSessionTests and DriveRerouteTests), and ops/mutate/drive.py holds the mutations (T-0317). What it cannot see: the Worker half - /plan's whitelist carries neither pins nor lambda today, so the wire encoding of RerouteRequest is a separate task, and NavAdapter's forwarding of fixes is Apple-side and not yet written. T-0328 (2026-10-08) THE APP REROUTES THROUGH THE PLAN TOKEN: the preview keeps /plan's plan_token with the ticket's place and budget (PlanContinuation), DriveSession carries the current token on every RerouteRequest and takes an answer's token only with the answer, and PlanRerouter sends ONE PlanClient.reroute (one 2-dp origin, the place, the budget, token and first_pin) - and NO request without a token, so with PLANS unbound the drive rejoins exactly as offline. Bound by name: the six tests of ScenicAPIClientTests' DriveReplanTests (token present / null x first pin 0 / last / past last through DriveController + PlanRerouter + a recording transport, each request and each taken answer compared whole; the meta-test that no row ignores its variant; the offline