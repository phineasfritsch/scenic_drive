# Load-bearing properties. ops/check-pins runs every assertion; see ops/lib/pins.py for the rules.
#
# Fields: id, statement, why_no_test_catches_it, anchor (source|config|artifact|api|db|process|human),
#         runs_on [linux|mac|device|human], assertion (bash, run from repo root, exit 0 = holds),
#         owner, added, last_verified, verifier (must differ from owner), expires_days, pending (task id).
# Never anchor a pin on a comment. Red pins are allowed; TODO assertions are not.

- id: P-SRC-01
  statement: Root-package targets import Foundation only - never CoreLocation, MapKit, UIKit, SwiftUI, MapLibre, Ferrostar
  why_no_test_catches_it: The code compiles and tests pass on the Mac; only Linux CI notices, ten minutes after an agent reported success
  anchor: source
  runs_on: [linux, mac]
  assertion: "! grep -rEn '^\\s*(@testable\\s+)?import\\s+(CoreLocation|MapKit|UIKit|SwiftUI|MapLibre|Ferrostar)' Sources/"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-SRC-02
  statement: No Swift source file exceeds 300 lines
  why_no_test_catches_it: A 900-line file is a merge grenade for parallel agents; nothing functional breaks. The old `find`-based assertion also passed vacuously over a deleted, renamed or emptied Sources/Tests tree (reviewer-10, same class as P-OPS-01).
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-line-cap"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-01
  statement: Every script in ops/ and .githooks/ is committed with the executable bit (git mode 100755); data files are not
  why_no_test_catches_it: core.filemode is false on the Windows checkout this repo is driven from, so a new script is committed 100644 and nothing complains. CI invokes them as `bash ops/x` and stays green, but queue/README.md and Xcode Cloud both invoke them directly, where a missing +x is a hard failure. The exec bit is invisible to every other check. The assertion also refuses to pass on an empty or truncated file set, which the original one-liner did (reviewer-5).
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-exec-bits"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-02
  statement: A failing test run names the tests that failed - every failure the counter counts, --list-failures names, and an unreadable report fails closed on both paths
  why_no_test_catches_it: The suite stays green while the runner is blind, so nothing goes red when the naming breaks. PR #14 printed `TESTS linux=85/76 failed=3` with no names and cost a debugging round of re-running every tier by hand in a container; the first fix for that was itself incomplete - --list-failures walked only <testcase> elements, so a summary-only <testsuite failures="1">, which is exactly what `swift test --xunit-output` writes into .artifacts/spm-junit.xml today, counted as a failure and named nothing (reviewer-18). A runner that hides which test broke is the fleet's central failure mode wearing a hat.
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-failure-naming"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-GIT-01
