  statement: Profile base JSON has the private/unpaved/track zero-gates; Worker rejects request models touching `road_access`/`surface`
  why_no_test_catches_it: "The Worker half is tested (customModel.test.ts (b), customModelGate.test.ts (f), the /plan request-shape and recorded-lambda tests), but ops/test only compares a TOTAL against pins/floor_linux.txt, so deleting, renaming or it.skip-ing the tests that refuse a road_access/surface model leaves ops/test green with the count above its floor while rejectCustomModel forwards a client's model that un-gates private or unpaved roads. This row binds those twelve tests BY NAME through ops/lib/run-named-tests.py (names in ops/lib/named-tests.json): every one must appear in vitest's JSON report and pass; a missing, skipped or failed name is red by name and a report that is missing is red. Seen RED on 2026-10-05 by the one-line mutant customModel.ts mentioned() `lowered.includes(word)` -> `lowered === word` (NAMED P-SAFE-01 passed=3/12, nine tests named FAILED) and by renaming `refuses road_access in a top-level condition` (passed=11/12, MISSING by name), then green 12/12. NOT ASSERTED HERE: the plan row's first clause - services/routing/profiles/car_scenic_base.json carrying the private/no-access, unpaved and track zero-gates - has no existing test (test_profiles_static.py tests bands and motorway/trunk, not the gates); it needs its own test before it can be bound. BY-NAME LIMIT (pre-review mutant pass M2b, 2026-10-05): the runner refuses a named test that is deleted, renamed, skipped or not run, and it cannot see an EMPTIED one - a body gutted to `expect(1).toBe(1)` keeps its name and passes - so these bindings hold the tests' presence, and their bodies stay a review matter. APPENDED 2026-10-06 (T-0281): the closures T-0276 sends as areas ride the same gate - three more names, 12 -> 15: closuresRoutes.test.ts `a fresh set rides every driven request as areas (R7, R8) > /plan|/loop|/trip: 200 with no closures_hazard; every model carries the areas and the zero clause, gate-clean; no car_fast model`, each asserting rejectCustomModel(model) === null on ever