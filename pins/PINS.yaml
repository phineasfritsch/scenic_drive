restored by git checkout: closuresStore `age <= CLOSURES_MAX_AGE_MS` -> `<` (passed=596/599, the three exactly-30-min rows FAILED); `CLOSURES_MAX_AGE_MS = 30 * 60 * 1000` -> `+ 1` (590/599, the eight 30 min + 1 ms stale rows and the /isochrone cache-hit test, whose record is 30 min + 1 ms old); withClosuresHazard `snapshot.hazard === null` -> `snapshot.hazard?.state !== \"stale\"` (151/599, all 448 unavailable rows); tripPlanner day legs `buildCustomModel(outcome.lambda, closures)` -> `null` (598/599); loopPlanner `buildCustomModel(LOOP_LAMBDA, closures)` -> `null` (588/599); plan.ts `snapshot.closures` -> `null` (591/599); closuresCron `Math.floor(nowMs / 1000)` -> `Math.ceil` (596/599, the clock table); lcsFeed `start <= nowS` -> `<` (595/599, cron clock and feed bound rows). The cross-product meta-test calls no src/ symbol, so it was shown red by a one-line test mutant dropping HOLDS_NO_SET (593/599, six names MISSING); then green 599/599. WHAT IT CANNOT SEE: /isochrone sends NO areas - GraphHopper's GET /isochrone has no body for a custom model (T-0276 R8), so reach may cross a closure; only its cache key and hazard are bound. The 50-polygon cap (customModel MAX_CLOSURE_POLYGONS, T-0276 R5) DROPS closures - measured 121 of 163 active Full D7 closures dropped on the recorded feed - so a route can cross an active closure the cap left out, silently. The owner has not created or bound the CLOSURES KV namespace (wrangler.jsonc binds none, held by test), so in prod today every request is unavailable-with-hazard and the cron writes nothing: the plan's 'freshness <= 30 min in prod' is unseen here. Nor can it see the 30 m buffer against real road geometry (unmeasured), or a test body emptied under its name (BY-NAME LIMIT, as P-SAFE-01). T-0282 (2026-10-06) SUPERSEDES the WHAT IT CANNOT SEE sentence above about the 50-polygon cap: the cron now stores every active Full closure up to CLOSURES_STORED_MAX_POLYGONS = 2000 (measured on the recorded feed: 163 closures, 173 polyg