- id: P-DATA-03
  statement: The PMTiles artifact AND the corpus.sqlite the app ships each carry meta.region equal to the active region and a built_at under 30 days old - the tiles half decided by the checker the build recipe itself runs, the corpus half by the shipping provenance check over corpora the shipping builder really built
  why_no_test_catches_it: "Both facts live inside a 63,520,949-byte binary that is never committed (`services/tiles/work/la.pmtiles`, .gitignored), so no test in the tree can look at them and nothing in CI can either. The failure is silent on a phone: an archive cut for another region, or a year-old one, renders a map that LOOKS like a map - roads, labels, the Protomaps credit under it - while the roads are the wrong city's or a year stale, and the app has no way to tell. `services/tiles/check_pmtiles.py` decides both properties and is what `build-la.sh` step 6 and `ops/publish-tiles` run, but until this pin nothing ever checked that those limbs still DECIDE anything: deleting the region comparison or the age comparison leaves every test in services/tiles/tests green on the limbs they cover and leaves the publish gate reporting PMTILES OK over a wrong-region archive. So the assertion runs the SHIPPING COMMAND - `python services/tiles/check_pmtiles.py <archive> --region-json services/etl/regions/la/region.json`, in a subprocess, exactly as the recipe spells it - over FOUR archives written in process by the tests' own writer (`services/tiles/tests/test_pmtiles_budget.py`: write_pmtiles / good_metadata): a fresh region-`la` one that must be ACCEPTED, one stamped 40 days back that must be REFUSED naming `older than 30 days (P-DATA-03)`, one stamped region `bay` that must be REFUSED naming `meta.region is 'bay'`, and one carrying NO region key at all that must be REFUSED naming `meta.region is None`. The fourth exists because of the pre-review mutant pass of 2026-09-19 (B4): changing the shipping checker's `meta.get(\"region\") != region` to `meta.get(\"region\", region) != region` ACCEPTS an archive nobody ever stamped - the failure this pin is for, arriving from a recipe that dropped its stamp - and that mutant was green on the three other fixtures and on all 69 tests in services/tiles/tests. With the fourth it exits 1 naming \"no meta.region at all: exit 0 (expected 1) ... did not name 'meta.region is None'\", demonstrated red then green on 2026-09-19 before this bullet was written. The fixtures are BUILT and not committed, because a committed archive carries a frozen built_at that goes stale in thirty days and would turn the age limb into a calendar. When `SCENIC_LA_PMTILES` names a file - the box that has the real build, and ops/publish-tiles - the same command runs over the REAL artifact and must exit 0; the variable set and naming nothing is a refusal, never a skip. Seen RED BY NAME on 2026-09-19 before green, twice, by removing one limb at a time from the shipping checker: with the region comparison disabled it exits 1 with `stamped region 'bay': exit 0 (expected 1)`, and with the age comparison disabled it exits 1 with `stamped 40 days ago: exit 0 (expected 1)`; green it prints all three verdicts and, with SCENIC_LA_PMTILES set, `la.pmtiles: exit 0 - PMTILES OK: la.pmtiles region=la bytes=63520949 zoom=0-14 tiles=2549`. THE CORPUS HALF, written by T-0219, is no longer a gap. Unlike the tiles side there was no corpus checker to subprocess - that absence WAS the defect - so ops/lib/check-corpus-provenance.py is both the decision and the harness, and `python ops/lib/check-corpus-provenance.py` is the entry point this pin, the pytest and an operator's `--corpus <file>` all run. `check_corpus` reads meta.region and meta.built_at through plain sqlite3 over the meta table opened READ-ONLY (`file:<path>?mode=ro`), which is the read shape services/etl/etl/surfacecoverage.py and corpusmatch.py already use; NOT CorpusWriter, which has no read path at all and whose __init__ os.remove()s an existing file, so `reading` the 19,906,560-byte union corpus through it would DELETE it. The expected value is READ from services/etl/regions/la/region.json's `id` and never typed, so a corpus can never supply the expectation it is judged against. It decides SIX corpora built in process by the shipping `corpus.build` over the seven-way services/etl/tests/fixtures/corpus_extract.json: a fresh region-la one ACCEPTED (a checker that refuses everything proves nothing), one stamped 40 days back REFUSED naming `older than 30 days (P-DATA-03)`, one stamped region `bay` REFUSED naming `meta.region is 'bay'`, one carrying NO region key REFUSED naming `meta.region is None`, one carrying NO built_at key REFUSED naming `meta.built_at is missing`, and one stamped two days AHEAD refused naming `is in the future by more than` - the last because rv1-pr109 R1 on the tiles side found the age limb one-sided, and a corpus is worse exposed: `--built-at` is a required operator-typed argument (corpus.py, \"An INPUT: no clock is read\"), so a wrong year is reachable by hand and not only from a host clock set ahead. The two absent-key fixtures are built by the shipping builder and then have that ONE meta row deleted through sqlite, because CorpusWriter.finalize REFUSES a corpus missing any REQUIRED_META_KEY and an absent key therefore cannot be built; the only other way is a second writer, which would no longer be the shipping stamp. Nothing is committed, for the same reason as the tiles fixtures. `SCENIC_LA_CORPUS` naming a file runs the same decision over the REAL artefact, which must pass; set and naming nothing is a refusal, never a skip. Seen RED BY NAME on 2026-09-19 before green, five mutants applied to a COPY of the checker by ops/lib/check-corpus-provenance-mutations.py (`--prove-red`, 5/5 refused by name; the driver refuses a mutation site that does not occur exactly once, so a table that has drifted from the code is a failure rather than a pass, and it carries a literal MUTANT_FLOOR of 5, so a table emptied by a bad merge prints a refusal instead of `0/0 mutants refused` and exit 0 - seen red at 2 rows on 2026-09-19): the region comparison deleted -> `stamped region 'bay'`; `meta.get(\"region\")` widened to `meta.get(\"region\", region)`, the T-0197 B4 shape, which accepts a corpus nobody stamped -> `no meta.region at all`;