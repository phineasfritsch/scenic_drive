  runs_on: [linux]
  assertion: "P=\"${PYTHON:-$(command -v python3 || command -v python)}\" && \"$P\" ops/lib/check-schema-version.py && \"$P\" ops/lib/run-named-tests.py P-PROD-05"
  owner: agent/claude-opus-5
