  added: 2026-09-08

- id: P-OPS-05
  statement: ops/sane's documented exit-code precedence is the order its checks actually run in - the EXIT_ORDER array and the fail() call sites agree
  why_no_test_catches_it: "ops/sane promises 'the FIRST failing check in this order decides' and then lists the order in a header comment. The promise is kept by fail(), which keeps the first code it is given, so the real precedence is EXECUTION ORDER and nothing but a reader's attention held the comment and the code together. It has now come apart twice. The worktrees block once sat above the production section, so a dead backend plus one stranded worktree exited 10 where the table said 7; it was moved to the bottom of the file with a comment saying why. T-0024 then inserted its bounds block ABOVE the production section and added its row BELOW 9, and a dead backend plus one out-of-band extract exited 4 where the table said 7 - reproduced by agent/rv-t0024 on 2026-09-18 with a fabricated services/etl/work/sfbay/meta.json carrying motorway 8000 and API_URL=http://127.0.0.1:9 bash ops/sane --prod, which printed both FAIL lines and then SANE FAIL exit=4. No test could catch it because the documented order lived only in a comment, and CLAUDE.md is explicit that a guard must never be anchored on one. So the order is data now - EXIT_ORDER=(2 7 3 9 4 10) - and ops/lib/check-sane-exit-order reads that array and the literal codes of the fail '<name>' '<msg>' <code> call sites in file order, keeps each code's first appearance, and refuses on any disagreement. It is fail-closed: no file, no EXIT_ORDER array, a fail() call whose code is not a literal, or zero call sites found all exit 2 rather than printing ok, because a scan that scanned nothing must not read as a pass. Seen red three ways before it was seen green: on the pre-fix ops/sane with no array (exit 2, reporting the code order 2,4,7,3,9,10), on the pre-fix ops/sane with the array added (exit 1, first divergence at position 2 - documented 7, code 4), and on the FIXED ops/sane carrying the header's original row order 2,3,7,9,4,10 (exit 1, first divergence at position 2 - documented 3, code 7), which is how the stale 3-before-7 row was found and corrected."
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-sane-exit-order"
  owner: agent/claude-opus-5
  added: 2026-09-18

- id: P-GIT-04
  statement: The pre-commit hook refuses a commit whose staged content differs from the working tree, and reads the touches list from the task file as staged
  why_no_test_catches_it: "Nothing in this repository ever ran the hook against a stale index. Six agents in one session shipped a commit whose staged content was the pre-edit blob - `git mv` stages the rename, the file is then rewritten, the edit is never re-staged - and `git status` shows a clean rename while `git show HEAD:<the path>` proves the verdict never landed. PR #69's CI went red on 2026-09-18 for exactly that. T-0047 built the check and PR #30 merged it into the STACKED branch task/T-0039 a day after that branch had already landed on main, so the child never followed and nothing noticed for eleven days: `grep -rn ALLOW_PARTIAL_STAGE` over main hit one line, the task's own Brief. The touches half is the same class in the other direction - the gate read the WORKING-TREE task file, so widening the list in an editor and leaving that edit unstaged let a forbidden path land under a committed list that still forbids it. ops/lib/check-stale-stage.py runs fourteen throwaway repositories; eight of its cases are red on the hook at origin/main and six are false-positive controls, because a hook that refuses a legitimate commit is worse than the bug it guards."
  anchor: process
  runs_on: [linux, mac]
  assertion: "\"${PYTHON:-$(command -v python3 || command -v python)}\" ops/lib/check-stale-stage.py"
  owner: agent/claude-opus-5
  added: 2026-09-18
