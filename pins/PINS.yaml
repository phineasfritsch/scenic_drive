- id: P-PRIV-02
  statement: "UIBackgroundModes is exactly [audio, location] while the drive (NavAdapter's DriveNavigator) is present and absent without it - the plan's subset-of-{location, audio} row, ruled exact by T-0329 R4 - in the source Info.plist and in the BUILT ScenicDrive.app's plist; the project generates no plist and adds no mode through a build setting"
  why_no_test_catches_it: "A background mode is a key Apple reads at install and review time; no Swift test can see it, and every edit of the plist builds. Spoken guidance needs audio, and audio alone speaks nothing in the background because a backgrounded app gets no location fix, so location rides with it; an extra mode (fetch, remote-notification) is a review rejection and a privacy surface the plan never allowed. ops/lib/check-background-modes.py reads the plist through plistlib and requires LIST EQUALITY (order, duplicates, extras, a string for an array, the key missing, the key with no drive all refused), requires GENERATE_INFOPLIST_FILE = NO and INFOPLIST_FILE = ScenicDrive/Info.plist in both configurations with no INFOPLIST_KEY_UIBackgroundModes, and with --built-products (ios-compile.yml, after the simulator build) reads the built app's plist the same way. --prove-red refuses 13 mutations by name."
