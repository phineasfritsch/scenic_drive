ceiling); a crossing that survives, or whose re-request the cap forbids, is named in closures_hazard.crosses (lcs ids, stored order) on the 200 - never silent. Bound by name: closuresCrossing.test.ts (110: route x set {empty, X alone, the T-0276 fixture's 173 polygons} x shape {clear, vertex, edge, inside, through, built from X's own ring} x router {honours, ignores} through ROUTES, by full equality of the request count, every request's areas, the returned path and the hazard; the no-row-ignores-its-variant meta-tests; the loop's cap rows; the guard-failure rows; the re-request's whole body), closuresCrossingTrip.test.ts (15: a paid trip's search / last leg / search and first leg x days 2..5, each re-request's areas against C4's swap recomputed by removal for its own corridor) and closuresCrossingGeometry.test.ts (40: the predicate case by case, the picker and the swap) - 833 names. Seen RED by name through run-named-tests.py: closuresNearest's futile test `swap.closures.features.every((f) => sent.has(f))` -> `false` (816/833), restored. Mutation population services/api/test/mutate/crossingMutants.mjs: 59 entries, floor 59, 5 EQUIVALENT with witnesses, caught 59/59. WHAT IT STILL CANNOT SEE: the polygons are the Worker's 30 m buffers, still unmeasured against real road geometry; a router that ignores areas is caught after the fact (the hazard names the closure; nothing re-routes a second time); /isochrone sends no areas and returns no path (R8 unchanged)."
