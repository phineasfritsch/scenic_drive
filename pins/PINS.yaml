- id: P-SAFE-03
  statement: The handoff on the home screen is unreachable without a SafetyDisclaimer acknowledgement stored on the device, and the persistent line "Conditions change. Verify locally." is on that screen
  why_no_test_catches_it: "Nothing in this repository can run a SwiftUI view. apps/ios/Packages/ScenicApp/Package.swift says why in its own words - NO TEST TARGETS HERE, deliberately and temporarily - because every proof of this gate is an XCUITest in a simulator and there is no Apple toolchain on the authoring box. So the gate can be deleted and every gate in the tree stays green: the guard is three lines inside a view builder, removing `guard isSafetyDisclaimerAcknowledged else { onBlocked(); return }` compiles, renders identically in a screenshot, and ships a build whose FIRST tap leaves for Apple Maps having shown nobody the disclaimer; the persistent line is one Text and removing it also compiles. That is the risk table's `sedan onto dirt/gated/closed road` row with its two named mitigations quietly gone. The assertion is therefore structural, over the Swift source, and it decides only what source can decide: SafetyDisclaimer declared once in its own file; home.disclaimer and home.conditions in ScenicHomeScreen.swift and home.disclaimer.accept in SafetyDisclaimer.swift; the on-device @AppStorage key; SkylineHandoff.open( called from exactly one file, GatedHandoffButton.swift, at a line the `guard` on the acknowledgement dominates (the guard precedes it and the brace depth never returns below the guard's between them); and GatedHandoffButton( built in exactly one file, ScenicHomeScreen.swift, with the acknowledgement passed through rather than a literal. PR #101's two reviews found four more holes and every one of them failed OPEN - the check stayed at exit 0 over a tree whose FIRST tap could leave for Apple Maps un-acknowledged, which is this statement false with its own assertion green - so four anchors close them: (a) the @AppStorage DEFAULT, the whole declaration `private var isSafetyDisclaimerAcknowledged = false` as a fixed string on the first line carrying code after the key line, because @AppStorage yields its DECLARED default whenever nothing is stored, which is every fresh install, and `= true` is an acknowledgement nobody gave; (b) the call-graph population, now EVERY *.swift under apps/ios recursively instead of one directory at -maxdepth 1, because SkylineHandoff is a public enum exported from the FeatureScenicHome product and a second call one directory down, or in apps/ios/ScenicDrive/ which already imports that product, escaped a per-directory scan while the check printed `called once`; (c) GatedHandoffButton( counted by OCCURRENCE rather than by file, with that one construction's argument list read and required to carry `isSafetyDisclaimerAcknowledged: isSafetyDisclaimerAcknowledged` and no `: true`, because a second button beside the real one sits in the same file as the real one; and (d) the one WRITE to the acknowledgement, the assignment `isSafetyDisclaimerAcknowledged = true`, counted by OCCURRENCE over every *.swift under apps/ios and required EXACTLY ONCE, in ScenicHomeScreen.swift, at a line a brace-depth walk places INSIDE the `SafetyDisclaimer(onAccept: {` block - because @AppStorage's setter is nonmutating, so `.onAppear { isSafetyDisclaimerAcknowledged = true }` anywhere on that screen compiles and writes true the moment the screen appears, the button is then built with true through the REAL pass-through so (c) sees nothing wrong, the guard passes, and the first tap of every launch leaves for Apple Maps with the sheet never presented, which is (a)'s defect reached by an assignment instead of a default (agent/rv2-pr101, finding B4); the same assertion refuses a DELETED write, where accepting the sheet records nobody and the user is asked again forever, so this region is anchored in BOTH directions and not only the closed one. (e) EVERY OCCURRENCE of the identifier `isSafetyDisclaimerAcknowledged`, counted with multiplicity over every *.swift under apps/ios with // stripped, against a tracked set typed into the check - GatedHandoffButton.swift(2), the stored property and the guard's read, and ScenicHomeScreen.swift(4), the @AppStorage declaration, the argument label and the value of the pass-through, and the one write - with any other count in any file refused by name. (d) was a BLACKLIST with ONE entry, the literal `isSafetyDisclaimerAcknowledged = true`, so `.onAppear { isSafetyDisclaimerAcknowledged.toggle() }` beside the real write left the count at one, the depth walk still found the real write inside the accept closure, and the check printed `written exactly once` over a screen with two writers while the first tap of a fresh install left for Apple Maps (agent/rv3-pr101, finding B5). Spellings of `writes a Bool` are unbounded - `.toggle()`, `= !false`, `self.` prefixed, a helper the closure calls - and every one of them must MENTION the flag, which is why the count of the identifier is the anchor and a longer blacklist is not; the counts are typed literals rather than derived from the anchors already read, because a derived expectation moves whenever an anchor moves and a change that both adds an occurrence and satisfies some anchor would pass silently (T-0153 ruling R4-B). (f) the literal store key `safety.disclaimer.acknowledged.v1`, exactly once over the same population, at the @AppStorage declaration: @AppStorage is a UserDefaults wrapper, so `UserDefaults.standard.set(true, forKey: the same key)` writes the same store on the next body evaluation without naming the identifier once, and (e) is blind to it. Added before the review, because it was the seventh blind spot and a liveness hole in a safety pin: the BLOCKED path is anchored too - onBlocked() between the guard and its return in GatedHandoffButton.swift, and the two fixed strings `onBlocked: { isShowingDisclaimer = true }` and `isPresented: $isShowingDisclaimer` on ScenicHomeScreen.swift, without which `onBlocked: { }` keeps all six earlier mutations green while the first tap does nothing and the disclaimer never appears. Every anchor is an identifier, a file name or a user-visible string, counted over code with // stripped, never a comment (CLAUDE.md). It was seen red by name against origin/main's tree, whose FeatureScenicHome had no SafetyDisclaimer.swift, and --prove-red refuses thirteen mutations by name (the table is ops/lib/check-safety-disclaimer-mutations, which mutates a throwaway copy of the whole of apps/ios; the source readers it exercises are ops/lib/check-safety-disclaimer-lib) - rows 8 to 13 are the acknowledgement defaulting to true, a second call site in the app shell, a second button beside the real one in the same file, the acknowledgement written outside the accept closure (moved up to an `.onAppear`, which leaves the occurrence count at one and is refused by the depth walk alone), a second writer spelled `.toggle()` beside the real one (refused by (e) alone - (d), the depth walk and every call-graph anchor are green on it), and a second writer through `UserDefaults.standard.set(true, forKey:)` on the key, which names the identifier nowhere and is refused by (f) alone. WHAT IT CANNOT SEE, so that nobody reads more into a green than is there: whether the sheet renders, whether the write inside the accept closure ever RUNS - that a write EXISTS, exactly once and inside that closure, is anchored by (d), and that nothing else in apps/ios reaches the flag or its store is anchored by (e) and (f) as of 2026-09-19; the sentence this list carried between 05:06 and now, that (d) alone anchored `nothing else on the screen writes the flag`, was itself an over-claim in the open direction and is withdrawn - (d) reads ONE spelling. What (e) and (f) cannot see in their turn is any spelling that reaches the store without either literal in the source: a key assembled from a named constant, a string interpolation or a computed suite name, a write from a target outside apps/ios, or an acknowledgement recorded under some second key this pin has never heard of. Also unseen: whether @AppStorage reads back, whether the line is on screen or behind the map, contrast, Dynamic Type and the 44 pt target. XCUITest is the real proof of those and does not exist yet; it arrives with the first green Xcode Cloud run and anchors on the three identifiers this pin reserves. The plan's `SafetyDisclaimerDisplaying` protocol is M4's: there is one feature target and one screen today, and a conformance list with one entry cannot discriminate (T-0153 ruling R2). T-0273 EXTENDED the gate to the Surprise card BY WHITELIST, never around it: the card (FeatureSurpriseMe) never sees the acknowledgement or opens a URL - it calls the onOpenInMaps closure the home hands it through the shell, and the home's openSurprise builds a SECOND GatedHandoffButton( with the same pass-through and onBlocked; so (iv) counts GatedHandoffButton( exactly twice, both in ScenicHomeScreen.swift, (e)'s tracked set is ScenicHomeScreen.swift(6), and -pinned pins FeatureSurpriseMe's file set and bytes beside FeatureScenicHome's. --prove-red gains four rows, each refused by name: the card's Apple Maps button opening a URL itself (its pinned digest), the shell handing the card its own opener (the frozen shell), the second construction passing true (the identifier count), a file added beside the card (its pinned file set). rv1-t0273 B2 swapped FeatureSurpriseMe's `path:` in Package.swift to a NEW directory whose SurpriseCard opened Apple Maps itself, so the pinned directory was no longer what compiled; -doors, run LAST, closes the class by three whole-line WHITELISTS by occurrence over every regular *.swift under apps/ios - every URL-opening spelling (UIApplication, openURL, Link(, ShareLink, .open(, NSWorkspace and the rest) only at SkylineHandoff, the gate's call and the store links; every line naming SurpriseCard, ScenicHomeScreen or SettingsScreen only at its declaration and the shell's line; every Package.swift path/name/sources/targets line typed - and refuses any link under apps/ios. Rows 38-40 hold the path swap, a SurpriseCard shadow outside the shell and an environment openURL red. 2026-10-06 (rv2-t0273 B1): the opener list was still a list of spellings - `let go = scene.open; go(url, nil, nil)` (UIWindowScene.open as an unbound method reference) in a NEW MapAdapter/MapTapHandoff.swift, wired by one line in MapView.makeUIView, opened Apple Maps from a home-screen map tap with no disclaimer, every limb green, because MapAdapter was not content-pinned. The class is closed by CONTENT: -pinned's require_pinned_app_swift, run LAST, pins EVERY *.swift entry under apps/ios (all ScenicApp modules, Package.swift, the app shell and any test) by an exact file list and per-file sha256 (CRLF normalized), so any Swift file added, removed, renamed or changed anywhere under apps/ios is refused by name. FROM NOW ON EVERY SWIFT EDIT UNDER apps/ios MUST RE-APPROVE ITS DIGEST in PINNED_APP_SWIFT (ops/lib/check-safety-disclaimer-pinned) in the same commit, with the reason in the task's Log. -doors stays as defence in depth with its opener token widened to the BARE IDENTIFIERS open, windowScene, UIScene, UIWindowScene, perform and value(forKey, every occurrence at an approved whole line. Rows 41-43 hold rv2's two-file mutant, a one-line edit to MapAdapter/MapView.swift and a UI test file added in a new directory red. 2026-10-06 (T-0289, rv3-t0273 recordable 1): the guard read no project.pbxproj and no Swift outside apps/ios, so a pbxproj PBXFileReference, PBXBuildFile and Sources-phase entry for ../../tools/xcode-shell/SurpriseCard.swift - a module-local SurpriseCard whose button opens Apple Maps, shadowing the gated card for the frozen shell line - left check-safety-disclaimer at exit 0. require_pinned_app_swift now ends by calling ops/lib/check-safety-disclaimer-linked, which pins by WHITELIST, exact path list and per-file sha256 (CRLF normalized): every NON-Swift file under apps/ios (project.pbxproj, the shared scheme, Package.resolved, ci_post_clone.sh, Info.plist, assets and bundled data - the shell is an Xcode 26 buildable folder, so a .m dropped there compiles with no pbxproj edit, and a scheme pre-action or the post-clone script runs shell at build time; the one allowance is the git-ignored ScenicDrive/Tiles/*.pmtiles and *.pmtiles.json), the root Package.swift, and EVERY entry under Sources/ (ScenicKit, Handoff, PlaceStore, ScenicAPIClient, Telemetry, ScenicPlanCLI) - and every root-manifest line naming `path:` or `sources:` is compared whole to a typed list. The root tree is derived as apps/ios/../.., never a flag. FROM 2026-10-06 ON EVERY EDIT TO project.pbxproj, TO ANY OTHER NON-SWIFT FILE UNDER apps/ios, TO THE ROOT Package.swift OR TO ANY FILE UNDER Sources/ MUST RE-APPROVE ITS DIGEST in ops/lib/check-safety-disclaimer-linked-digests.txt (since 2026-10-07, T-0303: the four tables are data there, read fail-closed by -linked, each row bound to the tree both ways) in the same commit, with the reason in the task Log - Linux-only ScenicKit work included, because the app links those targets. Fail-closed on a Mac whose Xcode wrote xcuserdata/ or .swiftpm/ under apps/ios. Rows 44-47 hold rv3-t0273s exact pbxproj mutant, a one-line edit to Sources/Handoff/AppleMapsDirections.swift, a new Sources/ScenicKit/Shadow.swift and the root Handoff path: swapped red, each by name. Not seen: remote package bytes (MapLibre, GRDB; Package.resolved pins the revision). 2026-10-07 (T-0289, pre-review mutant M1): a Package@swift-6.swift BESIDE the root Package.swift - which SwiftPM, and Xcode through it, builds instead of Package.swift on any 6.x toolchain - moved Handoff to an unpinned Vendor/ and the check stayed at exit 0, because -linked read and listed only Package.swift and Sources/. -linked now also pins the root directory's TOP-LEVEL FILE NAMES by whitelist (ROOT_TOP_FILES: .git, .gitattributes, .gitignore, CLAUDE.md, LICENSE-DATA, Package.resolved, Package.swift, README.md; any other non-directory entry at the top, a symlink included, is refused as `root top: added NAME`). Package.resolved is named because op