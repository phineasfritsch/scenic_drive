- id: P-SAFE-09
  statement: "The plan's P-SAFE-06 row (that id in this file holds the guidance gate) - the motion gate: above 4.5 m/s, at an unknown speed, and before the first fix the drive surface is minimal (the one large action and voice); at 4.5 m/s exactly and below it is full"
  why_no_test_catches_it: "DriveSurface's predicate is one line, `speed >= 0 && speed <= 4.5`, and every edit of it compiles: a bound of 4.6 shows the full screen to a car doing 4.55 m/s, dropping `speed >= 0` shows the full screen at CoreLocation's -1 (invalid speed, which is how a moving car with a poor fix reports), and a session that starts at .full shows every control until the first fix lands. No functional test elsewhere reads the surface, and ops/test only counts. The assertion runs DriveMotionGateTests by NAME through ops/lib/run-named-tests.py - a full-equality table over 0, -0.0, the least nonzero, 4.5 and both its float neighbours, the greatest finite, both infinities, -1 and NaN, through the session's own observe(_:) - and ops/mutate/drive.py holds the mutations (T-0317). T-0324 closed the screen half: what the drive screen shows is ScenicKit's DriveDisplay(surface:mode:) - the one 60 pt action and nothing else while moving, the rejoin/reroute state as that action's caption - and DriveDisplayTests compares it WHOLE over every DriveSurface x DriveMode and through DriveDisplay(session:), the entry DriveNavigator publishes (four names added to this row: 9 in all); ops/lib/check-drive-display.py then whitelists, as whole lines, every apps/ios line naming DriveDisplay, DriveSurface, DriveMode or display, so a screen, host, shell or navigator that builds its own display is refused by name (--prove-red: 6/6). What it cannot see: whether the screen renders what it reads (the ios-screenshot drive shot), and whether a crawl near 4.5 m/s flickers (no hysteresis is ruled; device iterations decide)."
