n. T-0298 correction (2026-10-07): the T-0296 sentence above says a thirteen-step sequence over an empty and a holding variant; waitlistDedupe.test.ts's STEPS is EIGHTEEN steps, run over {empty, holding} x {session-only, legacy-headers} (IDENTITY_HEADERS unset vs '1'), and a bare legacy x-scenic-device header with the secret set counts as that device only under IDENTITY_HEADERS=1 with no Bearer; without the flag it is the unidentified bucket, and beside a Bearer it is the Bearer's sub or the unidentified bucket (this supersedes the thirteen steps and the two variants above)."
