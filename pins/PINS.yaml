- id: P-DATA-04
  statement: Every corpus records surface coverage per highway class in meta.surface_coverage, and etl.surfacecoverage refuses a class whose known fraction has fallen below the literal baseline measured from the LA canyon window - green over the committed real table, exit 1 naming the class over the committed below-baseline one, and exit 1 naming the classes it cannot judge over a corpus corpus.build really built whose table carries none of them at a judgeable size
  why_no_test_catches_it: "The scorer assumes an untagged primary/secondary/tertiary is paved and penalises an untagged residential by x0.8 with a surface_unknown flag (plan, Score per way / Absent surface). Both halves are claims about roads NOBODY SURVEYED, and neither is falsifiable from inside the pipeline: whatever fraction of ways carries a real surface tag, every producer runs, every test passes and a corpus is emitted. The failure is silent and total - `osmium tags-filter` losing `surface`, an extract rebuilt against the retired `paved` key, a class relabelled upstream - and what ships is a region where every road is 'assumed paved', scored and routed with nothing red. plan:283's M2 exit row has named this clause since the plan and nothing in the tree wrote the key until T-0205. It cannot be a unit test for two reasons: the quantity is a property of a POPULATION (11,740 ways of the real LA canyon window, measured and quoted in T-0205's Log before any predicate was written), and a test over the seven-way corpus_extract.json fixture ranges over classes of one and two ways, where a fraction means nothing - which is why MIN_CLASS_WAYS = 25 exists and why this pin runs over committed tables rather than over a built fixture. The baselines are the measured fractions x 0.75 truncated to three decimals (service 0.029, residential 0.091, track 0.013, tertiary 0.219, secondary 0.287, trunk 0.245, primary 0.377, unclassified 0.103, motorway_link 0.318, motorway 0.593): the defect sends a fraction to ~0, an order of magnitude below any of them, while ordinary OSM editing between rebuilds moves it by a point or two. The assertion runs the check BOTH WAYS over two committed fixtures, because a check that has only ever been seen green is untested: green over tests/fixtures/surface_coverage_la_window.json (the real measurement, 15 classes, refused=0) and REFUSING tests/fixtures/surface_coverage_below_baseline.json (the same table with residential's known count moved to 60 of 2562, 0.0234 against the 0.091 baseline), where exit 1 and the class named on stderr is the pass condition. Seen red before green on 2026-09-19, by name: with the writer removed from corpus.build the four meta tests fail with 'RuntimeError: meta is missing required keys: surface_coverage'; the check prints 'SURFACE REFUSED residential: surface coverage 0.0234 is below the baseline 0.091 (60 known of 2562 ways)' and exits 1 over the below-baseline fixture; and ops/mutate/surfacecoverage.py's 18 mutations - the comparison inverted, REFUSAL_EXIT set to 0, MIN_CLASS_WAYS raised past every real class, a baseline relaxed to 0.0, an untagged way counted as surveyed - are each caught by the test that names them. Hardened by the pre-review mutant pass on 2026-09-19 (rulings S0-S4 in T-0205's Log, seven more mutations, floor 18 -> 25): the id moved from P-DATA-03 (taken by the tiles meta pin, T-0197) to P-DATA-04; the baselined classes are a WHITELIST, so an empty table, a table whose classes were relabelled upstream and a table of nothing but classes under MIN_CLASS_WAYS are each refused by name rather than passing with nothing judged, and a genuinely small region is refused rather than given a flag that lowers the floor silently; a class EXACTLY on its baseline passes, asserted both ways; BASELINES is recomputed from the committed measurement in a test, so a literal quietly lowered to 0.001 fails; and the --corpus form is run as a subprocess over corpora corpus.build really built (one collapsed, one covered), which is why this assertion builds one too."
  anchor: source
  runs_on: [linux]
  assertion: "(cd services/etl && P=\"${PYTHON:-$(command -v python3 || command -v python)}\" && T=$(mktemp -d) && \"$P\" -m etl.surfacecoverage --table tests/fixtures/surface_coverage_la_window.json >/dev/null && ! \"$P\" -m etl.surfacecoverage --table tests/fixtures/surface_coverage_below_baseline.json >/dev/null 2>&1 && \"$P\" -m etl.corpus --input tests/fixtures/corpus_extract.json --out \"$T/c.sqlite\" --built-at 2026-01-01T00:00:00Z >/dev/null && ! \"$P\" -m etl.surfacecoverage --corpus \"$T/c.sqlite\" >/dev/null 2>\"$T/err\" && grep -q 'SURFACE REFUSED class residential' \"$T/err\"; rc=$?; rm -rf \"$T\"; exit $rc)"
