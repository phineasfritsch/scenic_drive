- id: P-COST-02
  statement: MAX_MONTHLY_UPSTREAM_CALLS is a compile-time constant in the Worker equal to the value pinned here
  why_no_test_catches_it: An agent will make it configurable, and a config value is a value an agent can raise
  anchor: source
  runs_on: [linux]
  assertion: "v=\"$(sed -n '/^- id: P-COST-02/,/^- id: /p' pins/PINS.yaml | sed -n 's/^  value: *//p' | tr -d '[:space:]')\"; test -n \"$v\" && test \"$(grep -oE '^export const MAX_MONTHLY_UPSTREAM_CALLS = [0-9_]+' services/api/src/quota.ts | grep -oE '[0-9_]+$' | tr -d _)\" = \"$v\" && ! grep -rqE 'MAX_MONTHLY_UPSTREAM_CALLS[[:space:]]*=[[:space:]]*[^0-9[:space:]]' services/api/src"
  owner: agent/claude-opus-5
  added: 2026-09-07
  value: 250000

- id: P-SAFE-05
  statement: Sunrise, sunset and civil twilight for 35 site-days (21N to 65N) match the US Naval Observatory within 90 s, and the fixtures come from USNO rather than from our own output
  why_no_test_catches_it: Swapping or "simplifying" the solar math shifts every golden-hour card and the after-dark hazard flag; no functional test notices, and a fixture regenerated from our own code would bless the error. sunrise-sunset.org was tried first and rejected as an oracle - it disagreed with USNO by 84-343 s on rise/set.
  anchor: source
  runs_on: [linux, mac]
  assertion: "grep -q 'Naval Observatory' Tests/Fixtures/solar/oracle.json && test $(grep -c 'SolarFixture(name:' Tests/ScenicKitTests/SolarFixtures.swift) -ge 20 && swift test --filter SolarFixtureTests 2>&1 | grep -qE 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed'"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-HUMAN-01
  statement: Human gate 1 - the developer drives 5 of their own commute routes; at least 4 beat the freeway and none is a rat-run
  why_no_test_catches_it: Cannot be automated; it is the one gate agents will most confidently claim to have passed
  anchor: human
  runs_on: [human]
  assertion: "test -f pins/evidence/P-HUMAN-01.md"
  expires_days: 30
  pending: T-0013
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-TEST-02
  statement: No assertion of the three recognised shapes takes its expected value from the thing it checks - a comparison against a static member of a type under Sources/, both sides of one receiver, or a range bound taken from such a member
  why_no_test_catches_it: It is the tests that are wrong, so every suite is green by construction and no amount of running them helps. Found EIGHT times in one session by six different reviewers, four of those inside tests written to close a previous instance - and three more survived in LambdaSearchTests after the defect had been named in that exact file and the fix commit described it at length. A person cannot see this shape in their own work; this check found those three in its first run against real history.
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/check-tests"
  # Scope is stated rather than implied. The check reads Swift under Sources/ and Tests/ only, and
  # nine shapes it cannot see are listed in ops/lib/check-self-referential-tests.py. It found three
  # real instances a person had been told about and still could not see; it is not a proof that none
  # remain, and a pin claiming otherwise would be this defect one level up.
  owner: agent/claude-opus-5
  added: 2026-09-08
