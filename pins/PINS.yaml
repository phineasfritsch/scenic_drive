- id: P-STORE-02
  statement: "`/asn` sets entitlement inactive on EXPIRED/REFUND/REVOKE"
  why_no_test_catches_it: "The property is a state write and a read - a notification of a deactivating type lands the row inactive, a replayed or older one never undoes it, and GET /entitlement answers inactive after it - and only a test can see it; ops/test counts a total, so a deleted, renamed or skipped /asn test reads green while a REFUND leaves the subscriber entitled. T-0269 (2026-10-06) binds SIXTY-ONE tests BY NAME through ops/lib/run-named-tests.py. asnState.test.ts, writes through the shipped handleAsn and the read through ROUTES['/entitlement'] (seven): `deactivating types set the row inactive > EXPIRED -> inactive`, `REFUND -> inactive`, `REVOKE -> inactive`, `GRACE_PERIOD_EXPIRED -> inactive` (the fourth entry of the shipped DEACTIVATES); `replay and out-of-order delivery never regress state (R6) > an older SUBSCRIBED after a newer EXPIRED leaves the row inactive` and `a notification with the stored signedDate (a replay) changes nothing`; `GET /entitlement through the shipped ROUTES (R8) > after REFUND the token is inactive`. asnVerify.test.ts, a forged notification changes nothing (fifty-four): the fifty-one rows of the defect table `every signedPayload defect is 400 with zero state change (shipped handleAsn)` with that describe's two sibling tests (a body that is not JSON; a body without signedPayload), and `the shipped ROUTES['/asn'] pins Apple's root > a chain valid in every respect but its self-made root is 400 through ROUTES with zero state change`. Seen RED on 2026-10-06 by one-line mutants of services/api/src, each then reverted: asnNotification.ts `ACTIVATES.includes(type) || grace ?` -> `ACTIVATES.includes(type) || grace || type === \"REFUND\" ?` (REFUND mapped active; passed=59/61 exit 1, `REFUND -> inactive` and `after REFUND the token is inactive` FAILED by name); entitlementStore.ts `WHERE excluded.signed_date > entitlements.signed_date` -> `>=` (passed=60/61 exit 1, the replay test FAILED by name - the out-of-order test cannot see this mutant, since an older signedDate is refused under both, so the replay test is bound beside it); entitlementStore.ts readEntitlement's `r.status === \"active\" && (...)` -> `(...)` (passed=60/61 exit 1, `after REFUND the token is inactive` FAILED by name); appleJws.ts `if (header.alg !== \"ES256\") reject(...)` -> `if (false) reject(...)` (passed=57/61 exit 1, the defect rows alg none, alg HS256, alg ES384 and alg absent FAILED by name); then green 61/61. NOT ASSERTED HERE: an EMPTIED test - BY-NAME LIMIT (pre-review mutant pass M2b, 2026-10-05): the runner refuses a named test that is deleted, renamed, skipped or not run, and it cannot see an EMPTIED one - a body gutted to `expect(1).toBe(1)` keeps its name and passes - so these bindings hold the tests' presence, and their bodies stay a review matter. T-0323 (2026-10-08) ASSERTS THE APP'S SIDE as far as Linux can see it. (1) The client sends the paid-tier header: the six tests of ScenicAPIClientTests' AccountTokenHeaderTests (planRequest, tripRequest, loopRequest - every plan, trip and loop request is compared WHOLE to literals carrying the device and the purchase's lowercased token, or no token; refusalReadsNothing; rowsFollowThePurchase) and AccountTokenCandidateTests' latest (the latest purchase's token in every StoreKit order) are bound BY NAME in named-tests.json - 67 names in all. Seen RED by name through run-named-tests.py: a renamed refusalReadsNothing (passed=66/67, MISSING) and IdentityHeaders `account.uuidString.lowercased()` -> `account.uuidString` (passed=64/67, planRequest, tripRequest and loopRequest FAILED), each restored; then green 67/67. (2) No fourth client inlines it: ops/lib/check-account-token-sites.py, a WHITELIST of sites - every line of every *.swift under Sources/ and apps/ matching `account-token` or `accountheader` case-insensitively (only `//`-leading lines skipped) must be, whole, one of the two IdentityHeaders.swift lines (the accountHeader constant and its one write in json()); its --