  statement: Requests per plan ≤12/3/12; ≤2 in flight per plan
  why_no_test_catches_it: "The cap is guardedPlan's `call`, which refuses past the reserved budget BEFORE fetch; PLAN_UPSTREAM_COST = 12 and LOOP_UPSTREAM_COST = 3. Counting fakes prove it, and a deleted, renamed or skipped counting test leaves ops/test's total above its floor while a plan spends a 13th request. This row binds seven tests BY NAME: /plan's 7 requests - at most 12 - one in flight; /plan's reservation of exactly 12 (PLAN_UPSTREAM_COST) before the first upstream call - the only bound test that sees the plan cap's value, since the 7-request fixture cannot see 13; /loop's at most 3 and its 4th-request refusal before fetch (which holds the literal 3 in `budget of 3`); guardedPlan's refusal past the budget and reservation-is-an-upper-bound; and quota's plan priced in upstream calls, which holds only PLAN_UPSTREAM_COST > 1, never its value. Seen RED on 2026-10-05 by the one-line mutant upstream.ts `spent > budget` -> `spent > budget + 1` (passed=4/6, the /loop 4th-request test and guardedPlan's past-the-budget test FAILED by name) and by renaming `refuses the call past the budget, and does not make it` (5/6, MISSING); then green 6/6. Review rv1 B1 (2026-10-05): the cap mutants quota.ts `PLAN_UPSTREAM_COST = 12` -> 13 (passed=6/7, /plan's reservation test FAILED by name) and loopPlanner.ts `LOOP_UPSTREAM_COST = 3` -> 4 (passed=6/7, /loop's 4th-request test FAILED by name) are both RED, then green 7/7. NOT ASSERTED HERE: the third 12 (road trip) - no road-trip endpoint exists; and '<=2 in flight' is proven only for /plan as one in flight at a time. BY-NAME LIMIT (pre-review mutant pass M2b, 2026-10-05): the runner refuses a named test that is deleted, renamed, skipped or not run, and it cannot see an EMPTIED one - a body gutted to `expect(1).toBe(1)` keeps its name and passes - so these bindings hold the tests' presence, and their bodies stay a review matter. T-0264 (2026-10-05): /isochrone's one request is now bound - isochroneCost.test.ts `the request count 