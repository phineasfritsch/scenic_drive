g that reaches a case without naming the identifier, e.g. `MapStyle.allCases[0]` (A4 - `MapStyle(rawValue: \"protomapsLALight\")` IS refused, because the identifier is counted inside string literals too). That is the XCUITest half and it belongs to T-0180, which also owns P-SAFE-03's: it anchors on the accessibility identifier the footer already carries, `attribution.footer` (declared in DesignSystem/AttributionFooter.swift, `.accessibilityIdentifier(\"attribution.footer\")`), and the snapshot it will assert over is `home-attribution-footer` AT MAX DETENT, in both themes and at AX5, which is what the plan's own P-ATTR-01 row spells (plan line 239: \"XCUITest id + snapshot at max detent\", \"visible on every map screen, every detent, both themes, AX5; not `accessibilityHidden`\" - the source of limb (e)) - no reference image exists today, and CLAUDE.md allows one to be recorded only by a human-initiated commit reviewed by a different agent; it is named here rather than set as a `pending:` key, because a pending pin's assertion is skipped entirely by ops/lib/pins.py and this half would then never run. 2026-10-06 (T-0289, rv3-t0273 recordable 3): check-map-attribution now calls require_pinned_app_swift as well, so P-ATTR-01 runs the same whole-app content pin as P-SAFE-03 - every *.swift under apps/ios and, through ops/lib/check-safety-disclaimer-linked, project.pbxproj, every other non-Swift file under apps/ios, the root Package.swift and every file under Sources/, each by exact path and sha256. A credit shadowed or a map surface added from any of those trees is refused by name. The RE-APPROVAL DUTY is P-SAFE-03s: from 2026-10-06 every pbxproj or root-package Swift edit re-types its digest in ops/lib/check-safety-disclaimer-linked-digests.txt (T-0303) in the same commit, and this pin goes red until it does."
