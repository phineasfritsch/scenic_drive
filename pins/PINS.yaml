# Load-bearing properties. ops/check-pins runs every assertion; see ops/lib/pins.py for the rules.
#
# Fields: id, statement, why_no_test_catches_it, anchor (source|config|artifact|api|db|process|human),
#         runs_on [linux|mac|device|human], assertion (bash, run from repo root, exit 0 = holds),
#         owner, added, last_verified, verifier (must differ from owner), expires_days, pending (task id).
# Never anchor a pin on a comment. Red pins are allowed; TODO assertions are not.

- id: P-SRC-01
  statement: Root-package targets import Foundation only - never CoreLocation, MapKit, UIKit, SwiftUI, MapLibre, Ferrostar
  why_no_test_catches_it: The code compiles and tests pass on the Mac; only Linux CI notices, ten minutes after an agent reported success
  anchor: source
  runs_on: [linux, mac]
  assertion: "! grep -rEn '^\\s*(@testable\\s+)?import\\s+(CoreLocation|MapKit|UIKit|SwiftUI|MapLibre|Ferrostar)' Sources/"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-SRC-02
  statement: No Swift source file exceeds 300 lines
  why_no_test_catches_it: A 900-line file is a merge grenade for parallel agents; nothing functional breaks
  anchor: source
  runs_on: [linux, mac]
  assertion: "test -z \"$(find Sources Tests -name '*.swift' -exec awk 'NR>300{print FILENAME; exit}' {} \\;)\""
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-OPS-01
  statement: Every script in ops/ and .githooks/ is committed with the executable bit (git mode 100755); data files are not
  why_no_test_catches_it: core.filemode is false on the Windows checkout this repo is driven from, so a new script is committed 100644 and nothing complains. CI invokes them as `bash ops/x` and stays green, but queue/README.md and Xcode Cloud both invoke them directly, where a missing +x is a hard failure. The exec bit is invisible to every other check.
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "test -z \"$(git ls-files -s ops .githooks | awk '$4 ~ /\.(json|txt|md)$/ || $4 == \"ops/api-url\" {next} $1 != \"100755\" {print $4}')\" && test -z \"$(git ls-files -s ops/api-url | awk '$1 != \"100644\" {print $4}')\""
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-GIT-01
  statement: .gitattributes normalizes every text file to LF
  why_no_test_catches_it: Lost on 2026-09-07 to a sweep-everything demo commit; every ops/* script would then break under WSL2 with no test failing
  anchor: config
  runs_on: [linux, mac]
  assertion: "grep -qE '^\\* text=auto eol=lf' .gitattributes"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-DATA-02
  statement: Root package declares iOS 18.4 as the platform floor (unified maps.apple.com waypoint URLs need it)
  why_no_test_catches_it: Bumping the target for a nicer API is a routine agent change with a silent revenue consequence
  anchor: config
  runs_on: [linux, mac]
  assertion: "grep -q 'iOS(\"18.4\")' Package.swift"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-TEST-01
  statement: Test-count floors exist, are integers, and the Linux floor is at least 3
  why_no_test_catches_it: ops/test enforces the floor, but an agent can delete the floor file and ops/test would fail to read it in a way that looks like a tooling error
  anchor: config
  runs_on: [linux, mac]
  assertion: "grep -qE '^[0-9]+$' pins/floor_linux.txt && grep -qE '^[0-9]+$' pins/floor_ios.txt && test \"$(cat pins/floor_linux.txt)\" -ge 3"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-PROC-01
  statement: No task reaches done/ without a reviewer who is not its owner
  why_no_test_catches_it: The one rule that pays for itself; nothing in the product breaks when it is skipped
  anchor: process
  runs_on: [linux, mac]
  assertion: "bash ops/queue-check >/dev/null"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-ATTR-02
  statement: LICENSE-DATA exists and credits OpenStreetMap contributors under ODbL
  why_no_test_catches_it: Attribution is a license obligation, not a feature; nothing fails when it is deleted
  anchor: artifact
  runs_on: [linux, mac]
  assertion: "test -f LICENSE-DATA && grep -q 'OpenStreetMap contributors' LICENSE-DATA && grep -qi 'ODbL' LICENSE-DATA"
  owner: agent/claude-opus-5
  added: 2026-09-07

