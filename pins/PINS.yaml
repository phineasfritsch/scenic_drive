- id: P-COST-02
  statement: MAX_MONTHLY_UPSTREAM_CALLS is a compile-time constant in the Worker equal to the value pinned here
  why_no_test_catches_it: An agent will make it configurable, and a config value is a value an agent can raise
  anchor: source
  runs_on: [linux]
  assertion: "v=\"$(sed -n '/^- id: P-COST-02/,/^- id: /p' pins/PINS.yaml | sed -n 's/^  value: *//p' | tr -d '[:space:]')\"; test -n \"$v\" && test \"$(grep -oE '^export const MAX_MONTHLY_UPSTREAM_CALLS = [0-9_]+' services/api/src/quota.ts | grep -oE '[0-9_]+$' | tr -d _)\" = \"$v\" && ! grep -rqE 'MAX_MONTHLY_UPSTREAM_CALLS[[:space:]]*=[[:space:]]*[^0-9[:space:]]' services/api/src"
  owner: agent/claude-opus-5
  added: 2026-09-07
  value: 250000

- id: P-SAFE-05
  statement: Sunrise, sunset and civil twilight for 35 site-days (21N to 65N) match the US Naval Observatory within 90 s, and the fixtures come from USNO rather than from our own output
  why_no_test_catches_it: Swapping or "simplifying" the solar math shifts every golden-hour card and the after-dark hazard flag; no functional test notices, and a fixture regenerated from our own code would bless the error. sunrise-sunset.org was tried first and rejected as an oracle - it disagreed with USNO by 84-343 s on rise/set.
  anchor: source
  runs_on: [linux, mac]
  assertion: "grep -q 'Naval Observatory' Tests/Fixtures/solar/oracle.json && test $(grep -c 'SolarFixture(name:' Tests/ScenicKitTests/SolarFixtures.swift) -ge 20 && swift test --filter SolarFixtureTests 2>&1 | grep -qE 'Test run with [1-9][0-9]* tests?( in [0-9]+ suites?)? passed'"
  owner: agent/claude-opus-5
  added: 2026-09-07

- id: P-SAFE-06
  statement: A GraphHopper sign that nothing maps fails the build - GuidanceMapping.maneuver(for:) has no catch-all clause
  why_no_test_catches_it: "The plan's own property table says `unknown code fails build`, and until PR #81's review the only thing holding it up was a sentence in GuidanceMapping.swift asking the next agent not to add `default:` - which CLAUDE.md forbids as a guard, because comments get stripped. The reviewer added `default: return .continueStraight`: swiftc emitted no diagnostic at all, every one of the 15 tests stayed green, and the mutation SURVIVED (1 of 24). `case _:` does the same thing without the word. No behavioural test can catch this, because it changes behaviour only for a sign that does not exist yet - which is the event the gate exists for. So the assertion COMPILES: three Guidance files copied into .artifacts/, one probe case added, and swiftc must reject them from GuidanceMapping.swift."
  anchor: source
  runs_on: [linux, mac]
  assertion: "bash ops/lib/check-guidance-gate"
  owner: agent/claude-opus-5
  added: 2026-09-15

- id: P-ROUTE-01
  statement: The pinned GraphHopper image's version equals GuidanceSign.sourceRelease, the release the sign table was transcribed from
  why_no_test_catches_it: "GuidanceSign carries 22 integers transcribed from GraphHopper 11.0. Nothing in this repository can notice that the router moved underneath them: every test here compares the table against itself, and a routing service pinned to another release would return signs this build decodes wrongly - or decodes as a throw at a junction. `services/routing/` does not exist yet, so the assertion cannot be written today; `pending: T-0135` is what makes that a debt the checker collects rather than a sentence in a closed task's log. check-pins FAILS if T-0135 is deleted, and FAILS if T-0135 reaches queue/done/ with this assertion still TODO."
  anchor: source
  runs_on: [linux, mac]
  assertion: TODO
  pending: T-0135
  owner: agent/claude-opus-5
  added: 2026-09-15

