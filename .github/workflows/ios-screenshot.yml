# iOS screenshot - the first time the app RUNS anywhere. Dispatch-only, never a required check.
#
# WHY IT EXISTS (T-0235): the owner has no Mac, and ios-compile.yml proves only that the tree builds. This job
# boots an iOS 26 simulator, installs and launches the app, and uploads PNGs of its first screen - the home
# screen - in light and dark as ONE artifact, `ios-screenshots`, so the app can be SEEN. It proves nothing about
# signing or TestFlight (T-0009). The runner needs network: the demo style is remote. apps/ios/ScenicDrive/Tiles/
# la.pmtiles is gitignored, so CI draws the MapLibre demo tiles and credits them as such - BasemapResolver's
# fallback, not a defect.
#
# GUARDRAILS: the same as ios-compile.yml (T-0157, T-0167) and read by the same check,
# ops/lib/check-ios-compile-guardrails.py, whose bare run reads BOTH files; this file's pinned structure is
# ops/lib/ios_screenshot_pinned.py. Dispatch-only; contents: read and no job-level permissions; the standard
# macos-15 label; a job timeout; bash everywhere and no continue-on-error; checkout and upload-artifact only;
# no commit and no push; DEVELOPER_DIR the only environment variable. Its own file, not a second job in
# ios-compile.yml: "ios-compile green" means the tree compiles and nothing else, and a stateful simulator run
# fails for reasons that are not the compiler.
name: ios-screenshot

on:
  workflow_dispatch:

concurrency:
  group: ios-screenshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `shell: bash` makes every run: step `bash -e -o pipefail`: a failed build piped into tee fails the step.
defaults:
  run:
    shell: bash

jobs:
  simulator-screenshot:
    runs-on: macos-15
    timeout-minutes: 30
    # The same pinned Xcode as ios-compile.yml, for the same reason: the image defaults to 16.4.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: toolchain and the simulators this image carries
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes

      # Chosen from what the image HAS, never guessed: the newest available iOS 26.x runtime, then from that
      # runtime's own supported device types the numbered iPhone with the highest number (the shortest name
      # among equals - the base model). Both are printed. A fresh device is created from the pair, so nothing
      # depends on a device the image happened to pre-create.
      - name: choose, create and boot the simulator
        run: |
          test -d "$DEVELOPER_DIR" || { echo "ios-screenshot: $DEVELOPER_DIR is not on this image"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/DerivedData/screens"
          xcrun simctl list -j runtimes > "$RUNNER_TEMP/runtimes.json"
          python3 - "$RUNNER_TEMP/runtimes.json" "$RUNNER_TEMP/choice" <<'PY'
          import json, re, sys
          rts = [r for r in json.load(open(sys.argv[1]))["runtimes"]
                 if r["name"].startswith("iOS ") and r.get("isAvailable") and r["version"].split(".")[0] == "26"]
          if not rts:
              sys.exit("ios-screenshot: no available iOS 26.x runtime on this image - the list is printed above")
          rt = max(rts, key=lambda r: [int(x) for x in r["version"].split(".")])
          def rank(d):
              m = re.match(r"iPhone (\d+)", d["name"])
              return (int(m.group(1)), -len(d["name"]), d["name"]) if m else None
          phones = [d for d in rt.get("supportedDeviceTypes", []) if rank(d)]
          if not phones:
              sys.exit("ios-screenshot: " + rt["name"] + " lists no numbered iPhone device type")
          dt = max(phones, key=rank)
          print("ios-screenshot: runtime " + rt["name"] + " " + rt["identifier"] + " - the newest available iOS 26.x")
          print("ios-screenshot: device type " + dt["name"] + " " + dt["identifier"] + " - its newest numbered iPhone")
          open(sys.argv[2], "w").write(rt["identifier"] + " " + dt["identifier"] + "\n")
          PY
          read -r RUNTIME DEVTYPE < "$RUNNER_TEMP/choice"
          UDID=$(xcrun simctl create scenic-screenshot "$DEVTYPE" "$RUNTIME")
          echo "ios-screenshot: created $UDID"
          echo "$UDID" > "$GITHUB_WORKSPACE/DerivedData/sim-udid"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"

      # For the CONCRETE device just booted, not generic/platform: the .app must run on it. -derivedDataPath
      # under the workspace (gitignored); CODE_SIGNING_ALLOWED=NO - a simulator build needs no identity.
      - name: build for that simulator
        run: |
          UDID=$(cat "$GITHUB_WORKSPACE/DerivedData/sim-udid")
          xcodebuild \
            -project apps/ios/ScenicDrive.xcodeproj \
            -scheme ScenicDrive \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$GITHUB_WORKSPACE/DerivedData/xcodebuild.log"

      # A crash is a failed job, never a picture of the springboard: `simctl launch` failing fails the step
      # under bash -e, and the pid it prints is checked alive - simulator apps are host processes - after the
      # settle and again after the capture. The settle is FIXED at 15 s: a cold first launch, the remote demo
      # style, and its first tiles.
      - name: install, launch, and screenshot light then dark
        run: |
          UDID=$(cat "$GITHUB_WORKSPACE/DerivedData/sim-udid")
          BUNDLE=com.phineasfritsch.scenicdrive
          SETTLE=15
          SHOTS="$GITHUB_WORKSPACE/DerivedData/screens"
          APP=$(find "$GITHUB_WORKSPACE/DerivedData/Build/Products" -maxdepth 2 -name '*.app' -path '*-iphonesimulator/*')
          test "$(printf '%s\n' "$APP" | grep -c .)" = 1 || { echo "ios-screenshot: expected exactly one simulator .app, found: $APP"; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          alive() {
            ps -ww -o command= -p "$1" | grep ScenicDrive || { echo "ios-screenshot: ScenicDrive (pid $1) is not running $2 - it crashed"; exit 1; }
          }
          for LOOK in light dark; do
            xcrun simctl ui "$UDID" appearance "$LOOK"
            LAUNCHED=$(xcrun simctl launch "$UDID" "$BUNDLE")
            echo "$LAUNCHED"
            PID=${LAUNCHED##*: }
            case "$PID" in ''|*[!0-9]*) echo "ios-screenshot: simctl launch printed no pid: $LAUNCHED"; exit 1;; esac
            sleep "$SETTLE"
            alive "$PID" "${SETTLE}s after the $LOOK launch"
            xcrun simctl io "$UDID" screenshot --type=png "$SHOTS/home-$LOOK.png"
            alive "$PID" "after the $LOOK screenshot"
            xcrun simctl terminate "$UDID" "$BUNDLE"
          done
          ls -l "$SHOTS"

      # One artifact, both PNGs, kept 7 days. No write scope is needed: the artifact goes through the runner's
      # own channel, and the token stays contents: read. A capture that wrote nothing fails here, not green.
      - name: upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: DerivedData/screens/*.png
          retention-days: 7
          if-no-files-found: error

      - name: why it failed
        if: failure()
        run: |
          tail -n 40 "$GITHUB_WORKSPACE/DerivedData/xcodebuild.log" || true
          find ~/Library/Logs/DiagnosticReports -name 'ScenicDrive*' -print -exec head -c 4000 {} \; || true
          xcrun simctl spawn booted log show --last 5m --style compact --predicate 'process == "ScenicDrive"' | tail -n 60 || true
