# Linux CI — the per-push loop. Never needs a Mac or a secret.
#
#   pins-source-only : ~20 s. The import ban and the 300-line cap, on plain ubuntu. A PR that adds `import SwiftUI`
#                      to Sources/ScenicKit fails here before anything compiles.
#   core             : the full Linux tier — ops/test (root swift package + Worker vitest when present),
#                      ops/check-pins, ops/queue-check, ops/agent-preflight — inside the pinned swift image.
name: linux-core

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: linux-core-${{ github.ref }}
  # Cancel superseded PR runs only; every main commit keeps its own check (reviewer-2 finding).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `shell: bash` makes every run: step `bash -e -o pipefail`. GitHub's unspecified-shell default is `bash -e`
# WITHOUT pipefail, so `cmd | tail -3` would report success when cmd fails (reviewer-2 finding).
defaults:
  run:
    shell: bash

jobs:
  pins-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # P-OPS-06 runs ops/lib/check-ios-compile-guardrails.py, which reads .github/workflows/ios-compile.yml
      # as DATA and exits 2 - "cannot tell" - rather than guessing when PyYAML is not importable. Whether a
      # hosted image ships it is not something this repository controls, so: try the import, install the
      # distro package only if that fails (pip would need --break-system-packages, same reasoning as the
      # core job below), and PRINT the version either way so the run log says which path was taken.
      - name: PyYAML for the workflow-as-data pin
        run: |
          python3 -c "import yaml" || { sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends python3-yaml; }
          python3 -c "import yaml; print('PyYAML ' + yaml.__version__)"
      - name: check-pins --source-only
        run: bash ops/check-pins --source-only

  core:
    runs-on: ubuntu-latest
    # Pin by digest: a moving tag is a silent toolchain change. Bump deliberately, in its own task.
    container:
      image: swift:6.1-noble@sha256:98ee3a8469ce2a9c2f543ef2577939ab44e2dfc9b5ed710732a59e5dd64f9c4a
    steps:
      - name: toolchain (git, sqlite headers for GRDB, python for ops/*)
        run: |
          apt-get update -q
          # python3-pytest from apt, not pip: Debian's python3 is externally-managed, so `pip install` would
          # need --break-system-packages, which is a worse habit than taking the distro package. ops/test
          # refuses loudly when no interpreter can import pytest, which is how this gap was found.
          # python3-yaml for the same reason (T-0167): this image carries a minimal python3, and P-OPS-06's
          # check reads a workflow as data and exits 2 - "cannot tell" - without PyYAML, which would make
          # that pin red here on the day it landed. Every other ops/* reader parses its own YAML subset.
          apt-get install -y -q --no-install-recommends git ca-certificates curl python3 python3-pytest python3-yaml libsqlite3-dev sqlite3 >/dev/null
          git --version && python3 --version && python3 -m pytest --version && python3 -c "import yaml; print('PyYAML ' + yaml.__version__)" && swift --version | head -1
      - uses: actions/checkout@v4
      - name: git safety + hooks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config core.hooksPath .githooks
      - uses: actions/setup-node@v4
        if: hashFiles('services/api/package.json') != ''
        with:
          node-version: 22
      - name: worker deps
        if: hashFiles('services/api/package.json') != ''
        run: cd services/api && npm ci --no-audit --no-fund 2>&1 | tail -3
      - name: agent-preflight
        run: bash ops/agent-preflight
      - name: ops/test
        run: bash ops/test
      - name: check-pins
        run: bash ops/check-pins
      - name: queue-check
        run: bash ops/queue-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            .artifacts/*.xml
            .artifacts/*.json
            .artifacts/*.log
          # .artifacts/ is a HIDDEN directory and upload-artifact@v4 excludes hidden paths by default, so this
          # step logged "No files were found" and uploaded nothing on every run since it was written. A red CI
          # run therefore had no reports to download - which is how `failed=3` stayed anonymous.
          include-hidden-files: true
          # warn, not ignore: a silently empty upload is the failure mode this step just had.
          if-no-files-found: warn
          retention-days: 7
